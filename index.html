// Schneller, authentifizierter App-Start ohne teure Monatsabrechnung.
// Der echte Monatsbericht wird danach aus dem Backend nachgeladen.
async function ftOpenShell(){
 if(!ST.token){FT_DASHBOARD_LOADING=false;auth();return;}
 const seq=++FT_LOAD_SEQ,start=performance.now(),month=ST.month,companyId=ST.cid;
 try{
  const initial=await api('home',{month,companyId,view:'shell',reportsMode:'none'});
  if(seq!==FT_LOAD_SEQ || month!==ST.month||companyId!==ST.cid)return;
  if(!initial?.me)throw Error('Sitzung konnte nicht bestätigt werden.');
  ST.h=initial;
  if(initial.company?.slug&&initial.logo)ftRememberBrand(initial.company.slug,{
   name:initial.company.name,logo:initial.logo,color:initial.company.color,
   secondaryColor:initial.profile?.secondaryColor||'#172c44'
  });
  ST.h.segments=ST.h.segments||[];ST.h.changes=ST.h.changes||[];ST.h.sick=ST.h.sick||[];
  FT_VIEWS_LOADED.clear();FT_VIEW_FETCHED_AT.clear();
  FT_LAST_CONTEXT=(initial.company?.id||'SYS')+'|'+initial.month;
  FT_DASHBOARD_LOADING=Boolean(initial.company);
  theme(initial.company?.color||ST.brand?.color||'#f37850',initial.profile?.secondaryColor||ST.brand?.secondaryColor||'#172c44');
  render();
  console.info('[FireTime Tempo] Login-Oberfläche bereit nach '+Math.round(performance.now()-start)+' ms (Startdaten)');
  if(initial.company){
   // Absichtlich parallel zum bereits sichtbaren, bedienbaren Grundgeruest.
   load();
  }else{
   const key=FT_LAST_CONTEXT+'|dashboard';
   FT_VIEWS_LOADED.add(key);FT_VIEW_FETCHED_AT.set(key,performance.now());
  }
 }catch(err){
  console.warn('FireTime: schneller App-Start fehlgeschlagen; regulärer Abruf wird versucht.',String(err.message||err));
  FT_DASHBOARD_LOADING=false;
  await load();
 }
}
async function load(){
  if(!ST.token){ST.h=null;auth();return;}
  const loadSeq=++FT_LOAD_SEQ, loadStart=performance.now();
  const requestedTab=ST.tab, requestedMonth=ST.month, requestedCid=ST.cid;
  // Ein einziges signiertes home-Paket fuer die eigene Mitarbeiteroberflaeche.
  // Daten bleiben nur im RAM, firmenspezifisch und maximal 30 s frisch.
  // Administratoransichten ausserhalb des ersten Firmenaufrufs bleiben gezielt.
  // Monats- und Planungsdaten nur fuer den angeforderten Tab laden.
  // Das bisherige 'all' las beim Login unnoetig fast die gesamte Datenbank.
  const bulkRead=false;
  try{
    const home=await api('home',{month:requestedMonth,companyId:requestedCid,
      view:bulkRead?'all':requestedTab,
      reportsMode:bulkRead?'self':requestedTab==='reports'?'selected':requestedTab==='dashboard'?'self':'none',
      userId:requestedTab==='reports'?ST.selected:''});
    if(loadSeq!==FT_LOAD_SEQ || requestedTab!==ST.tab || requestedMonth!==ST.month || requestedCid!==ST.cid)return;
    console.info('[FireTime Tempo]',requestedTab,Math.round(performance.now()-loadStart)+' ms API+Verbindung');
    if(!home||!home.me)throw Error('Sitzung oder Benutzerdaten ungültig.');
    // Preserve sections already fetched in the same company/month, do not mix customer data.
    const context=(home.company?.id||'SYS')+'|'+home.month;
    const same=FT_LAST_CONTEXT===context&&ST.h?.me?.id===home.me.id;
    const view=ST.tab;
    const fresh={
      dashboard:['shifts','workShifts','reports'],staff:[],time:['activities'],
      reports:['months','reports'],leave:['leaves'],work:['workShifts'],
      standby:['shifts','segments','changes','sick','availability','availSubmissions'],sick:['sick'],
      availability:['availability','availSubmissions'],rules:[],settings:[],
      license:[],customers:[],profile:[]
    }[view]||[];
    if(same&&!bulkRead){
      if(!home.logo&&ST.h.logo)home.logo=ST.h.logo;
      for(const k of ['activities','availability','availSubmissions','shifts','segments','changes','sick','workShifts','leaves','months','reports']){
        if(!fresh.includes(k))home[k]=ST.h[k];
      }
    } else if(!same){FT_VIEWS_LOADED.clear();FT_VIEW_FETCHED_AT.clear();}
    FT_LAST_CONTEXT=context;
    ST.h=home;
    FT_VIEWS_LOADED.add(context+'|'+view);
    FT_VIEW_FETCHED_AT.set(context+'|'+view,performance.now());
    if(bulkRead){
      const bundled=['dashboard','staff','time','leave','sick','work','standby',
        'availability','profile','settings','customers','license'];
      // Im Mitarbeiterbereich ist der eigene Monatsbericht im Paket enthalten.
      // Bei Administratoren muss ein anderer Mitarbeiter gezielt geladen werden.
      if(home.me?.role==='STAFF')bundled.push('reports');
      const stamp=performance.now();
      for(const tab of bundled){
        FT_VIEWS_LOADED.add(context+'|'+tab);
        FT_VIEW_FETCHED_AT.set(context+'|'+tab,stamp);
      }
      console.info('[FireTime Tempo] Alle Mitarbeiteransichten gebuendelt: '+bundled.length+' Menues.');
    }
    ST.h.segments=ST.h.segments||[];ST.h.changes=ST.h.changes||[];ST.h.sick=ST.h.sick||[];
    if(me().role==='SYSADMIN'&&!ST.cid&&!['dashboard','customers','profile'].includes(ST.tab))ST.tab='dashboard';
    if(ST.tab==='rules'&&firm()){
      const key=firm().id+'|'+ST.month;
      if(!ST.rules||FT_RULES_KEY!==key){
        ST.rules=await api('rulesGet',{companyId:firm().id,month:ST.month});
        if(loadSeq!==FT_LOAD_SEQ)return;
        FT_RULES_KEY=key;
      }
    }
    if(firm()?.slug)try{localStorage.setItem('ft_last_firm_slug',firm().slug);}catch(_){} 
    // Refresh the public company brand for the next instant sign-in.
    if(firm()?.slug&&home.logo)ftRememberBrand(firm().slug,{
      name:firm().name,logo:home.logo,color:firm().color,
      secondaryColor:ST.h.profile?.secondaryColor||'#172c44'
    }); 
    theme(firm()?.color||ST.brand?.color||'#f37850',ST.h.profile?.secondaryColor||ST.brand?.secondaryColor||'#172c44');
    if(requestedTab==='dashboard')FT_DASHBOARD_LOADING=false;
    render();
  }catch(err){
    if(loadSeq!==FT_LOAD_SEQ)return;
    const message=String(err?.message||'Unbekannter Fehler.');
    if(/Sitzung abgelaufen|Bitte anmelden|Zugang nicht aktiv|Sitzung oder Benutzerdaten ungültig/i.test(message)){
      ST.token='';ST.h=null;sessionStorage.removeItem('ft_token');auth();
    }else if(ST.h?.me){
      const pane=document.getElementById('content');
      if(pane)pane.innerHTML='<div class="card">Die Ansicht konnte nicht geladen werden. '+E(message)+'</div>';
    }else auth();
    say(message,true);
  }
}

// Date inputs in mobile Safari can exceed CSS width due to native control sizing.
// Measure the real box and clamp only inputs that cross their card's inner edge.
function ftFitFormControls(root){
 if(!root||!root.isConnected)return;
 for(const input of root.querySelectorAll('label.field > input, label.field > select, label.field > textarea')){
  const card=input.closest('.card,.login,.ft-install-dialog');
  if(!card)continue;
  const rect=card.getBoundingClientRect(),style=getComputedStyle(card);
  const rightLimit=rect.right-(parseFloat(style.paddingRight)||0);
  const left=input.getBoundingClientRect().left;
  const max=Math.floor(rightLimit-left-1);
  if(max<72)continue;
  const inputRect=input.getBoundingClientRect();
  if(inputRect.right>rightLimit+1){
   input.style.setProperty('box-sizing','border-box','important');
   input.style.setProperty('min-width','0','important');
   input.style.setProperty('width',max+'px','important');
   input.style.setProperty('max-width',max+'px','important');
   input.dataset.ftOverflowFix='1';
  }
 }
}

 const views={dashboard,customers,license,staff,time,reports,leave,work,standby,sick,availability,rules,settings,profile};
 if(!ST.h?.me)return;

 document.querySelectorAll('.side button[data-tab],.ft-mobile-bar button[data-tab],.ft-mobile-sheet button[data-tab]').forEach(b=>{
   const active=b.dataset.tab===ST.tab;b.classList.toggle('on',active);
   if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
 });
 const el=document.getElementById('content');
 if(el){
  el.innerHTML=(views[ST.tab]||dashboard)();
  requestAnimationFrame(()=>{if(el.isConnected)ftFitFormControls(el);});
 }
 if(ST.tab==='reports')ftResumePdfJob();
 if(ST.tab==='leave'&&has('LEAVE'))Promise.resolve().then(()=>ftAbsenceFetch_(false));
 if(ST.tab==='staff'&&isAdmin())ftStaffVacationSync_();
}

function ftStaffVacationSync_(){
 const form=document.getElementById('staffForm');
 if(!form||!ftStaffVacationSupported_())return;
 const daysField=form.querySelector('[name="workdays"]');
 const rule=form.querySelector('[name="leaveRuleType"]');
 const year=form.querySelector('[name="leaveYearMode"]');
 const annual=form.querySelector('[name="leaveEntitlement"]');
 const basis=form.querySelector('[name="leaveRuleLegalBasis"]');
 const note=form.querySelector('[name="leaveRuleNote"]');
 const hint=document.getElementById('ftLeaveRulePreview');
 if(!daysField||!rule||!year||!annual)return;
 const days=String(daysField.value||'').split(',').map(x=>x.trim()).filter(Boolean);
 const valid=days.length>0&&days.every(d=>/^[1-7]$/.test(d))&&new Set(days).size===days.length;
 const weeks=rule.value==='STANDARD_5'?5:rule.value==='STANDARD_6'?6:0;
 const flexModel=ftStaffFlexSupported_()&&form.querySelector('[name="leaveWorkModel"]')?.value==='FLEX';
 const reference=Number(form.querySelector('[name="leaveFlexReferenceDays"]')?.value||0);
 const flexValid=flexModel&&Number.isInteger(reference)&&reference>0&&reference<=7;
 const calcDays=flexModel?reference:days.length;
 const canAuto=weeks>0&&(flexModel?flexValid:valid);
 if(canAuto)annual.value=String(calcDays*weeks);
 annual.readOnly=canAuto;
 annual.classList.toggle('ft-leave-readonly',canAuto);
 const flexSection=document.getElementById('ftStaffFlexSettings');
 if(flexSection)flexSection.hidden=!flexModel;
 const referenceInput=form.querySelector('[name="leaveFlexReferenceDays"]');
 const basisInput=form.querySelector('[name="leaveFlexBasis"]');
 if(referenceInput)referenceInput.required=flexModel;
 if(basisInput)basisInput.required=flexModel&&reference>0;
 const calendar=year.value==='CALENDAR';
 if(basis){basis.required=calendar;basis.closest('label.field').hidden=!calendar;}
 if(note){note.required=rule.value==='SPECIAL';note.closest('label.field').hidden=rule.value!=='SPECIAL';}
 if(hint)hint.textContent=flexModel?
  (flexValid?
   'Rechnerische Grundlage: '+reference+' vereinbarte Urlaubstage/Woche × '+(weeks||'individuelle Wochen')+
   (weeks?' = '+(reference*weeks)+' Tage pro Arbeitsjahr.':' – Jahressaldo bitte individuell prüfen.')+
   ' Einzelurlaub und Urlaubswochen werden erst bei Freigabe mit konkreter Sollstundengutschrift bewertet.':
   'Noch keine Referenz vereinbart. Urlaubsanträge sind möglich, aber weder automatische Jahresgutschrift noch Urlaubstageabbuchung werden durchgeführt.'):
  valid?
   (weeks>0?'Berechnung: '+days.length+' regelmäßige Arbeitstage/Woche × '+weeks+' Wochen = '+days.length*weeks+' Urlaubstage/Jahr.':
   'Individueller Anspruch. Gesetzliche Untergrenze bei '+days.length+' Tagen/Woche: '+days.length*5+' Urlaubstage/Jahr.')+
   (calendar?' Neues Urlaubsjahr: 1. Jänner, nur mit entsprechender Vereinbarung.':' Neues Urlaubsjahr: jedes Jahr zum Eintrittsdatum.'):
  'Bitte zuerst die regelmäßigen Arbeitstage korrekt eingeben (z. B. 1,2,3,4,5).';
}

const FT_PDF_JOB_STORE='ft_pdf_pending_job_v2';
let FT_PDF_RUNNING_ID='';
let FT_PDF_PREPARE_BUSY=false;
function ftPdfMessage(message,bad=false){
 const pane=document.getElementById('ftPdfArchive');
 if(pane){pane.textContent=message;pane.style.whiteSpace='normal';}

function ftPdfJobReady(result,job){
 try{sessionStorage.removeItem(FT_PDF_JOB_STORE);}catch(e){}
 const pane=document.getElementById('ftPdfArchive');
 if(pane&&ST.tab==='reports'&&firm()?.id===job.companyId&&ST.month===job.month&&(ST.selected||me().id)===job.userId){
  pane.innerHTML='<div class="row between"><span>PDF fertig: '+E(result.name||'Monatsbericht')+'</span><span><button class="btn" data-act="pdfView" data-id="'+E(result.id)+'">Ansehen</button><button class="btn" data-act="pdfDownload" data-id="'+E(result.id)+'">Herunterladen</button></span></div>';
 }

async function ftPollPdfJob(job){
 if(!job?.id||!job?.companyId||!job?.userId||!job?.month)return;
 if(FT_PDF_RUNNING_ID===job.id)return;
 FT_PDF_RUNNING_ID=job.id;
 try{
  // Einmal-Trigger starten in Apps Script nicht zwingend sofort.
  // Auch langsame Dokumentenerstellung kann mehrere Minuten benötigen.
  for(let n=0;n<48;n++){
   await new Promise(resolve=>setTimeout(resolve,10000));
   let r;
   try{r=await api('pdfJobStatus',{id:job.id,companyId:job.companyId,userId:job.userId,month:job.month});}
   catch(err){ftPdfMessage('PDF-Status vorübergehend nicht erreichbar: '+(err.message||'Verbindungsfehler'));continue;}
   if(r.status==='READY'){ftPdfJobReady(r,job);return r;}
   if(r.status==='ERROR'){
    try{sessionStorage.removeItem(FT_PDF_JOB_STORE);}catch(e){}
    ftPdfMessage('PDF konnte nicht erzeugt werden: '+(r.error||'Backend-Fehler ohne Details'),true);
    return null;
   }
   if(ST.tab==='reports'&&firm()?.id===job.companyId&&ST.month===job.month){
    ftPdfMessage('PDF wird erzeugt (Status: '+(r.status==='RUNNING'?'in Bearbeitung':'wartet auf Google')+'). Die Seite kann geöffnet bleiben.');
   }
  }
  ftPdfMessage('PDF ist nach längerer Zeit noch nicht fertig. Der Auftrag bleibt im Backend gespeichert. Bitte später erneut das Archiv öffnen.',true);
  return null;
 }finally{FT_PDF_RUNNING_ID='';}
}
function ftResumePdfJob(){
 if(ST.tab!=='reports'||!firm()||!me())return;
 let job=null;try{job=JSON.parse(sessionStorage.getItem(FT_PDF_JOB_STORE)||'null');}catch(e){}
 if(!job||!job.id||job.companyId!==firm().id||job.month!==ST.month||job.userId!==(ST.selected||me().id))return;
 ftPdfMessage('PDF-Auftrag vorhanden. Status wird geprüft …');
 if(!FT_PDF_RUNNING_ID)ftPollPdfJob(job).catch(err=>ftPdfMessage('PDF-Statusfehler: '+err.message,true));
}

async function ftPdfEncodeBase64_(blob){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onload=()=>{
   const v=String(reader.result||''),i=v.indexOf(',');
   if(i<0)reject(Error('PDF konnte nicht gelesen werden.'));
   else resolve(v.slice(i+1));
  };
  reader.onerror=()=>reject(Error('PDF konnte nicht gelesen werden.'));
  reader.readAsDataURL(blob);
 });
}
function ftPdfOfferDownload_(pdf){
 const url=URL.createObjectURL(pdf.blob);
 const a=document.createElement('a');a.href=url;a.download=pdf.name;
 document.body.appendChild(a);
 try{a.click();}finally{a.remove();setTimeout(()=>URL.revokeObjectURL(url),120000);}
}

async function ftArchiveApprovedMonth_(reviewed){

 const pane=document.getElementById('ftPdfArchive');
 const label='Monat freigegeben. Der Monatsnachweis wird automatisch archiviert …';
 if(pane&&ST.tab==='reports')pane.textContent=label;
 try{
  const context={companyId:reviewed.companyId,userId:reviewed.userId,month:reviewed.month};
  const pdf=await ftLocalPdf({download:false,userId:context.userId,forceStatus:'APPROVED',
   onProgress:()=>{if(pane&&pane.isConnected)pane.textContent=label;}});
  if(pdf.size>2*1024*1024)throw Error('Der Nachweis ist größer als 2 MB; der Google-Hintergrundauftrag übernimmt die Archivierung.');
  const base64=await ftPdfEncodeBase64_(pdf.blob);
  const stored=await api('pdfStore',{...context,base64,
   requestId:'approve_'+String(reviewed.id).replace(/[^a-zA-Z0-9_-]/g,'').slice(0,50)+'_'+String(reviewed.reviewedAt||'').replace(/[^0-9]/g,'').slice(0,17)});
  if(!stored?.id)throw Error('Das PDF wurde noch nicht im Archiv bestätigt.');
  if(pane&&pane.isConnected&&ST.tab==='reports'){
   pane.innerHTML='<div class="ft-pdf-archive-head"><strong>Automatisch archiviert</strong><span>Monatsfreigabe abgeschlossen.</span></div>'+
    ftPdfArchiveCard({...stored,month:context.month},(ST.h.users||[]).find(x=>x.id===context.userId)?.name||'',true);
  }
  return 'READY';
 }catch(err){
  console.warn('PDF-Sofortarchivierung nach Freigabe:',String(err.message||err));
  const status=reviewed.pdfArchive?.status;
  if(status==='QUEUED'||status==='RUNNING'||status==='READY'){
   if(pane&&pane.isConnected&&ST.tab==='reports')pane.textContent='Monat freigegeben. Der Google-Hintergrundauftrag archiviert den Bericht. Status: '+status+'.';
   return 'QUEUED';
  }
  if(pane&&pane.isConnected&&ST.tab==='reports')
   pane.textContent='Monat freigegeben, aber die PDF-Archivierung ist fehlgeschlagen: '+String(err.message||err)+'. Bitte PDF erneut erzeugen und speichern.';
  return 'ERROR';
 }
}

async function ftLocalPdf(options={download:true}){
 const c=firm(),month=ST.month,batch=options.bulk===true;
 if(!c?.id)throw Error('Keine Firma ausgewählt.');
 if(batch&&!isAdmin())throw Error('Nur Administratoren dürfen Sammel-PDFs herunterladen.');
 const rawIds=batch?options.userIds:[options.userId||ST.selected||me().id];
 if(!Array.isArray(rawIds)||!rawIds.length)throw Error('Bitte Mitarbeiter auswählen.');
 const ids=[...new Set(rawIds.map(String).filter(Boolean))];

   else if(total!==r.total||size!==r.size)throw Error('PDF wurde während des Ladens verändert.');
   const raw=atob(r.base64),data=new Uint8Array(raw.length);
   for(let j=0;j<raw.length;j++)data[j]=raw.charCodeAt(j);
   chunks.push(data);

   if(view){
     const win=window.open(url,'_blank');
     if(!win){link.click();say('PDF-Anzeige blockiert. Die Datei wird stattdessen heruntergeladen.');}
   }else link.click();
 }finally{
   link.remove();
   setTimeout(()=>URL.revokeObjectURL(url),120000);
 }
}

async function ftAbsencePdfDownload_(id,view){
 const context=ftAbsenceContext_();
 if(!context)return;
 const chunks=[];let total=null,size=null,name='FireTimePro_Abwesenheiten.pdf';
 for(let i=0;i<512;i++){
  const r=await api('absencePdfChunk',{companyId:context.companyId,userId:context.userId,id,index:i});
  if(String(r.id)!==String(id)||r.index!==i||!Number.isInteger(r.total)||r.total<1||r.total>512)
   throw Error('PDF-Übertragung fehlerhaft.');
  if(total===null){total=r.total;size=r.size;name=r.name||name;}
  else if(total!==r.total||size!==r.size)throw Error('PDF-Daten wurden zwischenzeitlich geändert.');
  const raw=atob(r.base64),bytes=new Uint8Array(raw.length);
  for(let j=0;j<raw.length;j++)bytes[j]=raw.charCodeAt(j);
  chunks.push(bytes);
  if(i+1===total)break;
 }
 if(total===null||chunks.length!==total)throw Error('PDF unvollständig übertragen.');
 const file=new Blob(chunks,{type:'application/pdf'});
 if(file.size!==size)throw Error('PDF-Größe stimmt nicht.');
 const url=URL.createObjectURL(file),a=document.createElement('a');
 a.href=url;a.download=name;document.body.appendChild(a);
 try{
  if(view){
   const popup=window.open(url,'_blank');
   if(!popup){a.click();say('PDF-Anzeige blockiert. Download wird gestartet.');}
  }else a.click();
 }finally{
  a.remove();setTimeout(()=>URL.revokeObjectURL(url),120000);
 }
}

    }else if(/Android/i.test(agent)){
      showHelp('Bitte in Chrome oder Samsung Internet öffnen und im Browsermenü ⋮ → „App installieren“ oder „Zum Startbildschirm hinzufügen“ auswählen. In manchen E-Mail-Apps muss die Seite zuerst über „Im Browser öffnen“ geöffnet werden.');
    }else{
