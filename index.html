function ftViennaParts(value){

async function rpc(name,...args){
  const endpoint=String(window.FT_API_URL||'');
  if(!/^https:\/\/[^/]+\/api$/.test(endpoint)||endpoint.includes('DEIN-WORKER')){
    throw Error('Cloudflare-Adresse fehlt in config.js.');
  }
  let request;
  switch(name){
    case 'ft_login': request={type:'login',email:args[0],password:args[1],remember:args[2]===true};break;
    case 'ft_activate': request={type:'activate',invite:args[0],password:args[1]};break;
    case 'ft_resetRequest':request={type:'resetRequest',email:args[0]};break;
    case 'ft_resetConfirm':request={type:'resetConfirm',resetToken:args[0],password:args[1]};break;
    case 'ft_logout': request={type:'logout',token:args[0]};break;
    case 'ft_changePassword': request={type:'password',token:args[0],current:args[1],next:args[2]};break;
    case 'ft_brandForLogin':request={type:'brand',slug:args[0]};break;
    case 'pushInfo':request={type:'pushInfo'};break;
    case 'ft_api':request={type:'api',token:args[0],action:args[1],data:args[2]||{}};break;
    default:throw Error('Nicht freigegebener API-Aufruf: '+name);
  }
  const pdfAction=request.type==='api'&&['pdfPrepare','pdfArchive','pdfJobStatus','pdfChunk','pdfStore','pdfBatchArchive','pdfBatchChunk','pdfBatchStore','absencePdfCreate','absencePdfArchive','absencePdfChunk'].includes(request.action);
  const deadline=pdfAction?(['pdfStore','pdfBatchStore'].includes(request.action)?55000:request.action==='absencePdfCreate'?105000:request.action==='pdfPrepare'?25000:20000):65000;
  const abort=new AbortController();
  const timeout=setTimeout(()=>abort.abort(),deadline);
  let response;
  try{
    response=await fetch(endpoint,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(request),cache:'no-store',credentials:'omit',signal:abort.signal
    });
  }catch(err){
    if(err?.name==='AbortError')throw Error(pdfAction?'PDF-Server antwortet nicht innerhalb von '+Math.round(deadline/1000)+' Sekunden. Der Auftrag kann trotzdem bei Google laufen. Bitte nicht mehrfach starten.':'Verbindung zum Server hat zu lange gedauert.');
    throw Error('Server nicht erreichbar: '+String(err.message||err));
  }finally{clearTimeout(timeout);}
  let data;try{data=await response.json();}catch(e){throw Error('Die API liefert keine gültige Antwort (HTTP '+response.status+').');}

async function load(options={}){
  if(!ST.token){ST.h=null;auth();return;}
  const background=Boolean(options.background);
  const loadSeq=++FT_LOAD_SEQ, loadStart=performance.now();
  const requestedTab=ST.tab, requestedMonth=ST.month, requestedCid=ST.cid;
  // Ein einziges signiertes home-Paket fuer die eigene Mitarbeiteroberflaeche.
  // Daten bleiben nur im RAM, firmenspezifisch und maximal 30 s frisch.
  // Administratoransichten ausserhalb des ersten Firmenaufrufs bleiben gezielt.
  // Monats- und Planungsdaten nur fuer den angeforderten Tab laden.
  // Das bisherige 'all' las beim Login unnoetig fast die gesamte Datenbank.
  const bulkRead=false;
  try{
    const request=ftWarmPayload_(requestedTab,requestedMonth,requestedCid);
    const home=(!background&&!options.force)
      ?await ftWarmTake_(requestedTab,requestedMonth,requestedCid,request)
      :await api('home',request);
    if(loadSeq!==FT_LOAD_SEQ || requestedTab!==ST.tab || requestedMonth!==ST.month || requestedCid!==ST.cid)return;
    console.info('[FireTime Tempo]',requestedTab,Math.round(performance.now()-loadStart)+' ms API+Verbindung');
    if(!home||!home.me)throw Error('Sitzung oder Benutzerdaten ungültig.');
    // Preserve sections already fetched in the same company/month, do not mix customer data.
    const context=(home.company?.id||'SYS')+'|'+home.month;
    const same=FT_LAST_CONTEXT===context&&ST.h?.me?.id===home.me.id;
    const view=ST.tab;
    const fresh={
      dashboard:['shifts','workShifts','reports'],staff:[],time:['activities'],
      reports:['months','reports'],leave:['leaves'],work:['workShifts'],
      standby:['shifts','segments','changes','sick','availability','availSubmissions'],sick:['sick'],
      availability:['availability','availSubmissions'],rules:[],settings:[],
      license:[],customers:[],profile:[]
    }[view]||[];
    if(same&&!bulkRead){
      // Empty metadata fields in a compact response are intentional; reuse
      // only data authenticated earlier for exactly the same user and company.
      if(home.compact===true){
        for(const k of ['companies','directory','users','profile'])
          home[k]=ST.h[k];
      }
      if(!home.logo&&ST.h.logo)home.logo=ST.h.logo;
      for(const k of ['activities','availability','availSubmissions','shifts','segments','changes','sick','workShifts','leaves','months','reports']){
        if(!fresh.includes(k))home[k]=ST.h[k];
      }
    } else if(!same){
      FT_VIEWS_LOADED.clear();FT_VIEW_FETCHED_AT.clear();
      FT_WARM_CACHE.clear();FT_WARM_GENERATION++;
    }
    // Detect meaningful changes before replacing live state. An unchanged response
    // should not remount forms, scroll positions, expanded plans, or dialogs.
    const before=background&&same?JSON.stringify(ST.h):null;
    FT_LAST_CONTEXT=context;
    ST.h=home;
    if(!home.compact)FT_META_LAST_FETCH=Date.now();
    if(!same)ST.comm=null;
    if(typeof home.commUnread==='number')ftCommSetBadge_(home.commUnread);
    FT_VIEWS_LOADED.add(context+'|'+view);
    FT_VIEW_FETCHED_AT.set(context+'|'+view,performance.now());
    ftMarkLocalViews_();
    if(bulkRead){
      const bundled=['dashboard','staff','time','leave','sick','work','standby',
        'availability','profile','settings','customers','license'];
      // Im Mitarbeiterbereich ist der eigene Monatsbericht im Paket enthalten.
      // Bei Administratoren muss ein anderer Mitarbeiter gezielt geladen werden.
      if(home.me?.role==='STAFF')bundled.push('reports');
      const stamp=performance.now();
      for(const tab of bundled){
        FT_VIEWS_LOADED.add(context+'|'+tab);
        FT_VIEW_FETCHED_AT.set(context+'|'+tab,stamp);
      }
      console.info('[FireTime Tempo] Alle Mitarbeiteransichten gebuendelt: '+bundled.length+' Menues.');
    }
    ST.h.segments=ST.h.segments||[];ST.h.changes=ST.h.changes||[];ST.h.sick=ST.h.sick||[];
    if(me().role==='SYSADMIN'&&!ST.cid&&!['dashboard','customers','profile'].includes(ST.tab))ST.tab='dashboard';
    if(ST.tab==='rules'&&firm()){
      const key=firm().id+'|'+ST.month;
      if(!ST.rules||FT_RULES_KEY!==key){
        ST.rules=await api('rulesGet',{companyId:firm().id,month:ST.month});
        if(loadSeq!==FT_LOAD_SEQ)return;
        FT_RULES_KEY=key;
      }
    }
    if(firm()?.slug)try{localStorage.setItem('ft_last_firm_slug',firm().slug);}catch(_){} 
    // Refresh the public company brand for the next instant sign-in.
    if(firm()?.slug&&home.logo)ftRememberBrand(firm().slug,{
      name:firm().name,logo:home.logo,color:firm().color,
      secondaryColor:ST.h.profile?.secondaryColor||'#172c44'
    }); 
    theme(firm()?.color||ST.brand?.color||'#f37850',ST.h.profile?.secondaryColor||ST.brand?.secondaryColor||'#172c44');
    if(requestedTab==='dashboard')FT_DASHBOARD_LOADING=false;
    if(background&&same){
      if(before!==JSON.stringify(ST.h)&&ftAutoCanRender_())page();
      else ftCommUpdateBadges_();
    }else if(document.getElementById('content')&&FT_SHELL_SIGNATURE===ftShellSignature_()){
      // The tab's content changes, not the entire app shell or mobile menu.
      page();
    }else render();
    if(!background&&ST.tab==='dashboard')ftWarmSchedule_();
  }catch(err){
    if(loadSeq!==FT_LOAD_SEQ)return;
    const message=String(err?.message||'Unbekannter Fehler.');
    if(/Sitzung abgelaufen|Bitte anmelden|Zugang nicht aktiv|Sitzung oder Benutzerdaten ungültig/i.test(message)){
      ST.token='';ST.h=null;ftForgetSession_();auth();
    }else if(ST.h?.me){
      if(!background){
       const pane=document.getElementById('content');
       if(pane)pane.innerHTML='<div class="card">Die Ansicht konnte nicht geladen werden. '+E(message)+'</div>';
      }else console.warn('FireTime Hintergrund-Aktualisierung:',message);
    }else auth();
    if(!background)say(message,true);
  }
}

(function ftMobileNavAutoHide_(){
 let lastY=0,gestureY=0,hidden=false,queued=false;
 window.addEventListener('scroll',()=>{
  if(queued)return;
  queued=true;
  requestAnimationFrame(()=>{
   queued=false;
   if(window.matchMedia('(min-width:801px)').matches)return;
   const y=Math.max(0,window.scrollY||document.documentElement.scrollTop||0);
   const nav=document.querySelector('.ft-mobile-bar');
   if(!nav){lastY=y;gestureY=y;return;}
   const drawer=document.querySelector('.ft-mobile-sheet.is-open');
   if(drawer||nav.matches(':focus-within')||y<100){
    hidden=false;nav.classList.remove('ft-nav-scroll-hidden');
    lastY=y;gestureY=y;return;
   }
   const diff=y-lastY;
   if((diff>0&&y-gestureY>28)||(diff<0&&gestureY-y>20)){
    hidden=diff>0;
    nav.classList.toggle('ft-nav-scroll-hidden',hidden);
    gestureY=y;
   }
   if((diff>0&&gestureY>y)||(diff<0&&gestureY<y))gestureY=y;
   lastY=y;
  });
 },{passive:true});
})();

// Date inputs in mobile Safari can exceed CSS width due to native control sizing.
// Measure the real box and clamp only inputs that cross their card's inner edge.
function ftFitFormControls(root){
 if(!root||!root.isConnected)return;
 for(const input of root.querySelectorAll('label.field > input, label.field > select, label.field > textarea')){
  const card=input.closest('.card,.login,.ft-install-dialog');
  if(!card)continue;
  const rect=card.getBoundingClientRect(),style=getComputedStyle(card);
  const rightLimit=rect.right-(parseFloat(style.paddingRight)||0);
  const left=input.getBoundingClientRect().left;
  const max=Math.floor(rightLimit-left-1);
  if(max<72)continue;
  const inputRect=input.getBoundingClientRect();
  if(inputRect.right>rightLimit+1){
   input.style.setProperty('box-sizing','border-box','important');
   input.style.setProperty('min-width','0','important');
   input.style.setProperty('width',max+'px','important');
   input.style.setProperty('max-width',max+'px','important');
   input.dataset.ftOverflowFix='1';
  }
 }
}

let FT_COMM_POLL_TIMER=null;

async function ftCommPoll_(force=false){
 if(!ST.token||!firm()?.id||!ST.h?.commSupported||document.visibilityState==='hidden'||ST.commLoading||FT_COMM_POLL_BUSY)return;
 if(ST.tab==='messages'&&(ST.commCompose||document.activeElement?.closest('form')))return;
 const now=Date.now();
 if(!force&&now-FT_COMM_LAST_POLL<60000)return;
 FT_COMM_POLL_BUSY=true;FT_COMM_LAST_POLL=now;
 const cid=firm().id,uid=me()?.id;
 try{
  // A cheap count/revision first instead of loading every reply and every user.
  const pulse=await api('commPulse',{companyId:cid});
  if(firm()?.id!==cid||me()?.id!==uid)return;
  ftCommSetBadge_(pulse.unread);
  if(ST.tab==='messages'){
   const current=ST.comm;
   const previousMax=Math.max(0,...(current?.threads||[]).map(t=>Date.parse(t.updatedAt)||0));
   const contentChanged=!current||previousMax!==pulse.modified||
     current.threads.length!==pulse.total||Number(current.unread)!==Number(pulse.unread);
   if(force||contentChanged){
    const result=await api('commList',{companyId:cid});
    if(firm()?.id!==cid||me()?.id!==uid)return;
    const old=ST.comm;
    const changed=!old||JSON.stringify(old.threads)!==JSON.stringify(result.threads)||
      JSON.stringify(old.replies)!==JSON.stringify(result.replies);
    ST.comm=result;ftCommSetBadge_(result.unread);
    if(changed&&ftAutoCanRender_())page();
   }
  }
 }catch(err){console.warn('Nachrichten-Aktualisierung:',String(err.message||err));}
 finally{FT_COMM_POLL_BUSY=false;}
}

 }else{
  const img=document.createElement('img');img.alt='Angehängtes Foto';img.src=objectUrl;img.decoding='async';

   const warning=document.createElement('p');warning.className='muted small';
   warning.textContent='Das Bild kann auf diesem Gerät nicht angezeigt werden.';
   dialog.append(warning);
  },{once:true});
  dialog.append(header,img);
 }
 const cleanup=()=>{URL.revokeObjectURL(objectUrl);dialog.remove();};
 dialog.addEventListener('close',cleanup,{once:true});
 close.addEventListener('click',()=>dialog.close());
 document.body.append(dialog);
 try{dialog.showModal();}
 catch(err){cleanup();throw Error('Anhangsvorschau kann auf diesem Gerät nicht geöffnet werden.');}

}

function ftPushBase64_(str){
 const normalized=String(str||'').replace(/-/g,'+').replace(/_/g,'/');
 return Uint8Array.from(atob(normalized+'='.repeat((4-normalized.length%4)%4)),c=>c.charCodeAt(0));
}
async function ftPushHash_(value){
 const sum=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(value));
 return [...new Uint8Array(sum)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
let FT_PUSH_FETCHING=false;
async function ftPushRefresh_(force=false){
 if(!ST.token||!firm()?.id||FT_PUSH_FETCHING||!ST.h?.backgroundPushSupported)return;
 if(ST.pushSettings&&!force)return;
 FT_PUSH_FETCHING=true;
 const companyId=firm().id,userId=me()?.id;
 try{
  const [info,status]=await Promise.all([rpc('pushInfo'),api('pushStatus',{companyId})]);
  let subscription=null;
  if('serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window){
   const reg=await navigator.serviceWorker.getRegistration();
   subscription=reg?await reg.pushManager.getSubscription():null;
  }
  const hash=subscription?await ftPushHash_(subscription.endpoint):'';
  const linked=status.devices?.find(x=>x.endpointHash===hash);
  if(firm()?.id!==companyId||me()?.id!==userId)return;
  ST.pushSettings={info,status,onThisDevice:Boolean(linked),deviceId:linked?.id||'',subscription};
  if(ST.tab==='profile'&&!document.activeElement?.closest('form'))page();
 }catch(err){
  if(firm()?.id===companyId){ST.pushSettings={error:String(err.message||err)};
   if(ST.tab==='profile')page();}
 }finally{FT_PUSH_FETCHING=false;}
}
async function ftPushEnable_(){
 const settings=ST.pushSettings,n=ftCommNotificationState_();
 if(!settings?.info?.configured||!settings?.status?.deliveryConfigured)
  throw Error('Der Push-Dienst ist noch nicht vollständig eingerichtet.');
 if(!n.canAsk||!('serviceWorker' in navigator)||!('PushManager' in window))
  throw Error('Web Push wird auf diesem Gerät nicht unterstützt.');
 if(!n.installed&&/iPad|iPhone|iPod/i.test(navigator.userAgent))
  throw Error('Auf dem iPhone zuerst FireTime Pro zum Home-Bildschirm hinzufügen und als App öffnen.');
 const permission=n.permission==='granted'?'granted':await Notification.requestPermission();
 if(permission!=='granted')throw Error('Bitte Mitteilungen in den Handy-Einstellungen erlauben.');
 const registration=await navigator.serviceWorker.ready;
 let current=await registration.pushManager.getSubscription();
 const key=ftPushBase64_(settings.info.publicKey);
 if(!current)current=await registration.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key});
 const json=current.toJSON();
 await api('pushRegister',{companyId:firm().id,subscription:json,
  deviceName:((/iPad|iPhone|iPod/i.test(navigator.userAgent))?'Apple-Gerät':
    /Android/i.test(navigator.userAgent)?'Android-Gerät':'Browser')+' · '+new Date().toLocaleDateString('de-AT')});
 ST.pushSettings=null;await ftPushRefresh_(true);
}
async function ftPushDisable_(){
 const settings=ST.pushSettings,subscription=settings?.subscription;
 if(!settings?.onThisDevice)return;
 await api('pushUnregister',{companyId:firm().id,deviceId:settings.deviceId});
 if(subscription)try{await subscription.unsubscribe();}catch(err){console.warn('Push lokal:',err);}
 ST.pushSettings=null;await ftPushRefresh_(true);
}

function ftPositionHelpPopup_(){

 const left=Math.max(12,Math.min(r.left-10,vw-width-12));
 const below=vh-r.bottom-16,above=r.top-16;
 const onTop=below<170&&above>below;
 const space=Math.max(88,onTop?above-8:below-8);
 const height=Math.min(380,space);

 Object.assign(content.style,{
  left:left+'px',right:'auto',top:top+'px',width:width+'px',maxHeight:height+'px'
 });
}

function ftStaffParseDecimal_(value,label,min,max){
 const raw=String(value??'').trim().replace(/\u2212/g,'-').replace(/[\u00a0\s]/g,'');
 if(!/^[+-]?(?:\d+(?:[.,]\d+)?|[.,]\d+)$/.test(raw))
  throw Error(label+': Bitte eine gültige Zahl eingeben, z. B. 25,10 oder -7,35. Keine Tausendertrennzeichen.');
 const n=Number(raw.replace(',','.'));
 if(!Number.isFinite(n)||n<min||n>max)
  throw Error(label+': Zulässiger Bereich '+min+' bis '+max+'.');
 return n;
}

function ftStaffVacationSync_(){
 const form=document.getElementById('staffForm');
 if(!form||!ftStaffVacationSupported_())return;
 const daysField=form.querySelector('[name="workdays"]');
 const rule=form.querySelector('[name="leaveRuleType"]');
 const year=form.querySelector('[name="leaveYearMode"]');
 const annual=form.querySelector('[name="leaveEntitlement"]');
 const basis=form.querySelector('[name="leaveRuleLegalBasis"]');
 const note=form.querySelector('[name="leaveRuleNote"]');
 const hint=document.getElementById('ftLeaveRulePreview');
 if(!daysField||!rule||!year||!annual)return;
 const days=String(daysField.value||'').split(',').map(x=>x.trim()).filter(Boolean);
 const valid=days.length>0&&days.every(d=>/^[1-7]$/.test(d))&&new Set(days).size===days.length;
 const weeks=rule.value==='STANDARD_5'?5:rule.value==='STANDARD_6'?6:0;
 const flexModel=ftStaffFlexSupported_()&&form.querySelector('[name="leaveWorkModel"]')?.value==='FLEX';
 const reference=Number(form.querySelector('[name="leaveFlexReferenceDays"]')?.value||0);
 const flexValid=flexModel&&Number.isInteger(reference)&&reference>0&&reference<=6;
 const calcDays=flexModel?reference:days.length;
 const canAuto=weeks>0&&(flexModel?flexValid:valid);
 if(canAuto)annual.value=String(calcDays*weeks);
 annual.readOnly=canAuto;
 annual.classList.toggle('ft-leave-readonly',canAuto);
 const flexSection=document.getElementById('ftStaffFlexSettings');
 if(flexSection)flexSection.hidden=!flexModel;
 const referenceInput=form.querySelector('[name="leaveFlexReferenceDays"]');
 const basisInput=form.querySelector('[name="leaveFlexBasis"]');
 if(referenceInput)referenceInput.required=flexModel;
 if(basisInput)basisInput.required=flexModel&&reference>0;
 const calendar=year.value==='CALENDAR';
 if(basis){basis.required=calendar;basis.closest('label.field').hidden=!calendar;}
 const special=rule.value==='SPECIAL',specialContainer=document.getElementById('ftStaffSpecialFields');
 if(specialContainer)specialContainer.hidden=!special;
 const source=form.querySelector('[name="leaveRuleSource"]');
 if(source)source.required=special;
 if(note)note.required=false;
 if(hint)hint.textContent=flexModel?
  (flexValid?
   'Rechnerische Grundlage: '+reference+' vereinbarte Urlaubstage/Woche × '+(weeks||'individuelle Wochen')+
   (weeks?' = '+(reference*weeks)+' Tage pro Arbeitsjahr.':' – Jahressaldo bitte individuell prüfen.')+
   ' Einzelurlaub und Urlaubswochen werden erst bei Freigabe mit konkreter Sollstundengutschrift bewertet.':
   'Noch keine Referenz vereinbart. Urlaubsanträge sind möglich, aber weder automatische Jahresgutschrift noch Urlaubstageabbuchung werden durchgeführt.'):
  valid?
   (weeks>0?'Berechnung: '+days.length+' regelmäßige Arbeitstage/Woche × '+weeks+' Wochen = '+days.length*weeks+' Urlaubstage/Jahr.':
   'Individueller Anspruch. Gesetzliche Untergrenze bei '+days.length+' Tagen/Woche: '+days.length*5+' Urlaubstage/Jahr.')+

function ftTimePauseMinutes_(start,end){

 return Number.isFinite(a.getTime())&&Number.isFinite(b.getTime())?Math.round((b-a)/60000):0;
}
function ftTimePauseRequired_(kind,start,end){

function ftTimeSyncEndDate_(form){

 const day=start.value.slice(0,10),old=String(end.value||'');
 const clock=/T\d\d:\d\d$/.test(old)?old.slice(10):'T09:00';
 end.value=day+clock;

 // default to one hour after start; user can still choose next-day end.
 if(end.value<=start.value){
  const shifted=shiftedEnd(start.value,1);
  if(shifted)end.value=shifted;
 }
}

const FT_PDF_JOB_STORE='ft_pdf_pending_job_v2';
let FT_PDF_RUNNING_ID='';
let FT_PDF_PREPARE_BUSY=false;

function ftPdfJobReady(result,job){
 try{sessionStorage.removeItem(FT_PDF_JOB_STORE);}catch(e){}

async function ftPollPdfJob(job){
 if(!job?.id||!job?.companyId||!job?.userId||!job?.month)return;
 if(FT_PDF_RUNNING_ID===job.id)return;
 FT_PDF_RUNNING_ID=job.id;
 try{
  // Einmal-Trigger starten in Apps Script nicht zwingend sofort.
  // Auch langsame Dokumentenerstellung kann mehrere Minuten benötigen.
  for(let n=0;n<48;n++){
   await new Promise(resolve=>setTimeout(resolve,10000));
   let r;
   try{r=await api('pdfJobStatus',{id:job.id,companyId:job.companyId,userId:job.userId,month:job.month});}
   catch(err){ftPdfMessage('PDF-Status vorübergehend nicht erreichbar: '+(err.message||'Verbindungsfehler'));continue;}
   if(r.status==='READY'){ftPdfJobReady(r,job);return r;}
   if(r.status==='ERROR'){
    try{sessionStorage.removeItem(FT_PDF_JOB_STORE);}catch(e){}
    ftPdfMessage('PDF konnte nicht erzeugt werden: '+(r.error||'Backend-Fehler ohne Details'),true);
    return null;
   }
   if(ST.tab==='reports'&&firm()?.id===job.companyId&&ST.month===job.month){
    ftPdfMessage('PDF wird erzeugt (Status: '+(r.status==='RUNNING'?'in Bearbeitung':'wartet auf Google')+'). Die Seite kann geöffnet bleiben.');
   }
  }
  ftPdfMessage('PDF ist nach längerer Zeit noch nicht fertig. Der Auftrag bleibt im Backend gespeichert. Bitte später erneut das Archiv öffnen.',true);
  return null;
 }finally{FT_PDF_RUNNING_ID='';}
}
function ftResumePdfJob(){
 if(ST.tab!=='reports'||!firm()||!me())return;
 let job=null;try{job=JSON.parse(sessionStorage.getItem(FT_PDF_JOB_STORE)||'null');}catch(e){}
 if(!job||!job.id||job.companyId!==firm().id||job.month!==ST.month||job.userId!==(ST.selected||me().id))return;
 ftPdfMessage('PDF-Auftrag vorhanden. Status wird geprüft …');
 if(!FT_PDF_RUNNING_ID)ftPollPdfJob(job).catch(err=>ftPdfMessage('PDF-Statusfehler: '+err.message,true));
}

async function ftPdfEncodeBase64_(blob){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onload=()=>{
   const v=String(reader.result||''),i=v.indexOf(',');
   if(i<0)reject(Error('PDF konnte nicht gelesen werden.'));
   else resolve(v.slice(i+1));
  };
  reader.onerror=()=>reject(Error('PDF konnte nicht gelesen werden.'));
  reader.readAsDataURL(blob);
 });
}
function ftPdfOfferDownload_(pdf){
 const url=URL.createObjectURL(pdf.blob);
 const a=document.createElement('a');a.href=url;a.download=pdf.name;
 document.body.appendChild(a);
 try{a.click();}finally{a.remove();setTimeout(()=>URL.revokeObjectURL(url),120000);}
}

const FT_PAYROLL_COLS=[

let FT_PAYROLL_BUSY=false;

function ftPayrollPdf_(company,month,rows,total,approved){
 const W=842,H=595,S=1.5,left=35,nameW=255,colW=102,maxRows=20;
 const pages=[],totalPages=Math.ceil(rows.length/maxRows),color=/^#[\da-f]{6}$/i.test(company.color||'')?company.color:'#247ca4';
 function make(chunk,page){
  const can=document.createElement('canvas');can.width=Math.round(W*S);can.height=Math.round(H*S);
  const c=can.getContext('2d');if(!c)throw Error('PDF-Zeichenfläche ist nicht verfügbar.');
  c.setTransform(S,0,0,S,0,0);c.fillStyle='#fff';c.fillRect(0,0,W,H);
  const txt=(value,x,y,size=10,bold=false,ink='#273a4b',align='left')=>{
   c.fillStyle=ink;c.font=(bold?'bold ':'')+size+'px Arial, sans-serif';c.textAlign=align;
   c.fillText(String(value??''),x,y);c.textAlign='left';
  };
  const chop=(value,max)=>{let text=String(value||'');c.font='9px Arial, sans-serif';
   while(text.length&&c.measureText(text).width>max)text=text.slice(0,-1);return text;};
  c.fillStyle='#182d43';c.fillRect(0,0,W,98);c.fillStyle=color;c.fillRect(0,0,8,98);
  txt(company.name||'Firma',left,31,18,true,'#fff');
  txt('FIRETIME PRO  |  MONATSÜBERSICHT BUCHHALTUNG',left,55,11,true,'#deebf6');
  txt(ftPdfMonthLabel(month)+'  ·  '+rows.length+' Mitarbeiter  ·  '+approved+' freigegeben',left,77,10,false,'#fff');
  txt('Seite '+(page+1)+'/'+totalPages,807,77,10,true,'#fff','right');
  c.fillStyle='#eaf1f7';c.fillRect(left,115,W-2*left,46);
  txt('MITARBEITER',left+8,146,9,true);
  txt('BEREITSCHAFT',left+nameW+0.5*colW,130,10,true,'#18364e','center');
  txt('TATSÄCHLICHE ARBEITSZEIT',left+nameW+3*colW,130,11,true,'#18364e','center');
  const headings=['Gesamt','Gesamt','So.','Feiertag','Nacht'];
  headings.forEach((h,i)=>txt(h,left+nameW+(i+1)*colW-8,153,9,true,'#35516a','right'));
  const y0=174,rowHeight=16;
  for(let i=0;i<chunk.length;i++){
   const y=y0+i*rowHeight,row=chunk[i];
   if(i%2===0){c.fillStyle='#f0f5f9';c.fillRect(left,y-12,W-2*left,16);}
   txt(chop(row.name+(row.approved?'':' *'),nameW-15),left+8,y,9,!row.approved,row.approved?'#233a4f':'#a06925');
   FT_PAYROLL_COLS.forEach(([k],j)=>txt(ftPayrollFmt_(row.hours[k]),left+nameW+(j+1)*colW-8,y,9,false,'#223b50','right'));
  }
  if(page===totalPages-1){
   const y=y0+chunk.length*rowHeight+11;
   c.fillStyle='#182d43';c.fillRect(left,y-13,W-2*left,25);
   txt('SUMME FIRMA',left+8,y+3,10,true,'#fff');
   FT_PAYROLL_COLS.forEach(([k],j)=>txt(ftPayrollFmt_(total[k]),left+nameW+(j+1)*colW-8,y+3,10,true,'#fff','right'));
  }
  if(approved!==rows.length)txt('* VORLÄUFIG: Nicht alle Monatsberichte sind freigegeben!',left,521,10,true,'#a05a1c');
  txt('Alle Angaben in Stunden. Sonntag, Feiertag und Nacht können gleichzeitig zutreffen (nicht addieren).',left,541,9,false,'#52667c');
  txt('Bereitschaft: nur Gesamtstunden, einheitliche Vergütung; Einsätze sind aktive Arbeitszeit.',left,557,9,false,'#52667c');
  txt('Nacht 22–06 Uhr; Feiertage gemäß Firmenkalender Österreich. Keine automatische Lohnabrechnung.',left,572,9,false,'#52667c');
  txt('FireTime Pro  ·  Developed by Michael Mejtsky',808,585,8,false,'#8295a6','right');
  return can;
 }
 for(let start=0;start<rows.length;start+=maxRows)pages.push(make(rows.slice(start,start+maxRows),pages.length));
 // Embed each landscape A4 canvas as a JPEG XObject in an ordinary PDF.
 const enc=new TextEncoder(),parts=[],offsets=[0];let pos=0;
 function write(value){const b=typeof value==='string'?enc.encode(value):value;parts.push(b);pos+=b.length;}
 function obj(n,fragments){offsets[n]=pos;write(n+' 0 obj\n');for(const x of fragments)write(x);write('\nendobj\n');}
 write('%PDF-1.4\n');write(new Uint8Array([37,226,227,207,211,10]));
 obj(1,['<< /Type /Catalog /Pages 2 0 R >>']);
 obj(2,['<< /Type /Pages /Kids ['+pages.map((_,i)=>(3+i*3)+' 0 R').join(' ')+'] /Count '+pages.length+' >>']);
 pages.forEach((canvas,i)=>{
  const p=3+i*3,img=4+i*3,stream=5+i*3;
  const b64=canvas.toDataURL('image/jpeg',0.82).split(',')[1],raw=atob(b64),bytes=new Uint8Array(raw.length);
  for(let j=0;j<raw.length;j++)bytes[j]=raw.charCodeAt(j);
  obj(p,['<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /XObject << /P'+i+' '+img+' 0 R >> >> /Contents '+stream+' 0 R >>']);
  obj(img,['<< /Type /XObject /Subtype /Image /Width '+canvas.width+' /Height '+canvas.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+bytes.length+' >>\nstream\n',bytes,'\nendstream']);
  const commands='q '+W+' 0 0 '+H+' 0 0 cm /P'+i+' Do Q\n';
  obj(stream,['<< /Length '+enc.encode(commands).length+' >>\nstream\n',commands,'endstream']);
 });
 const xref=pos,count=3+pages.length*3;write('xref\n0 '+count+'\n0000000000 65535 f \n');
 for(let i=1;i<count;i++)write(String(offsets[i]).padStart(10,'0')+' 00000 n \n');
 write('trailer\n<< /Size '+count+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF');
 const blob=new Blob(parts,{type:'application/pdf'});
 return {blob,size:blob.size,pages:pages.length,name:'FireTimePro_'+String(company.slug||'Firma').replace(/[^a-z0-9_-]/gi,'_')+'_'+month+'_Buchhaltung.pdf'};
}
async function ftPayrollGenerate_(){
 if(!isAdmin()||FT_PAYROLL_BUSY)return;
 const c=firm(),month=ST.month,companyId=c?.id,button=document.querySelector('[data-act="payrollPdf"]');
 const status=document.getElementById('ftPayrollStatus'),preview=document.getElementById('ftPayrollPreview');
 if(!companyId)return;
 const progress=value=>{if(status&&status.isConnected)status.textContent=value;};
 FT_PAYROLL_READY=null;
 FT_PAYROLL_BUSY=true;if(button){button.disabled=true;button.textContent='Buchhaltungs-PDF wird erstellt …';}
 try{
  progress('Prüfe Firmenkalender und Monatsfreigaben …');
  const [home,rules]=await Promise.all([
   api('home',{companyId,month,view:'reports',reportsMode:'none'}),
   api('rulesGet',{companyId,month})
  ]);
  if(firm()?.id!==companyId||ST.month!==month)throw Error('Firma oder Monat wurde während des Exports geändert.');
  if(rules?.current?.holidayCalendar!=='AT')throw Error('Der Firmen-Feiertagskalender ist nicht Österreich. Bitte die Zuschlagsregeln prüfen, bevor Feiertagsstunden für die Buchhaltung ausgewiesen werden.');
  if((c.nightStart!==undefined&&Number(c.nightStart)!==22)||(c.nightEnd!==undefined&&Number(c.nightEnd)!==6))
   throw Error('Die konfigurierte Firmennachtzeit entspricht nicht 22:00–06:00 Uhr. Der Buchhaltungsbogen benötigt dafür eine eigene Auswertung.');
  const people=(home.users||[]).filter(u=>String(u.companyId)===String(companyId)&&u.role==='STAFF')
    .sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'de-AT'));
  if(!people.length)throw Error('Keine Mitarbeiter für diese Firma gefunden.');
  const states=new Map((home.months||[]).map(x=>[String(x.userId),String(x.status)]));
  const rows=new Array(people.length);let at=0,done=0;
  await Promise.all(Array.from({length:Math.min(2,people.length)},async()=>{
   while(at<people.length){
    const index=at++,u=people[index],snap=await api('report',{companyId,month,userId:u.id});
    if(firm()?.id!==companyId||ST.month!==month)throw Error('Firma oder Monat wurde geändert.');
    if(String(snap?.user?.id)!==String(u.id)||!snap?.report)throw Error('Monatsbericht fehlt: '+u.name);
    const hours={};
    for(const [k] of FT_PAYROLL_COLS){
     const v=snap.report[k];
     if(v===undefined||v===null||!Number.isFinite(Number(v))||Number(v)<0)
      throw Error('Der Bericht von '+u.name+' enthält keine gültige Angabe für '+k+'.');
     hours[k]=Number(v);
    }
    const state=states.get(String(u.id))||'OFFEN';
    rows[index]={id:String(u.id),name:String(u.name),hours,approved:state==='APPROVED'||state==='FINAL'};
    progress('Monatsberichte geladen: '+(++done)+' von '+people.length+' Mitarbeitern …');
   }
  }));
  const total=Object.fromEntries(FT_PAYROLL_COLS.map(([k])=>[k,0]));
  for(const row of rows)for(const [k] of FT_PAYROLL_COLS)total[k]+=row.hours[k];
  const approved=rows.filter(x=>x.approved).length;
  if(preview&&preview.isConnected)preview.innerHTML=ftPayrollPreview_(rows,total,month);
  progress('Kompaktes Buchhaltungs-PDF wird erzeugt …');
  const pdf=ftPayrollPdf_(c,month,rows,total,approved);
  if(pdf.size>8*1024*1024)throw Error('Der Buchhaltungsbogen übersteigt das Archivlimit von 8 MB.');
  let archived=false,problem='';
  try{
   progress('Buchhaltungsbogen wird dauerhaft im PDF-Sammelarchiv gespeichert …');
   const saved=await api('pdfBatchStore',{companyId,month,userIds:rows.map(x=>x.id),
    base64:await ftPdfEncodeBase64_(pdf.blob),requestId:'LOHNBUCH_'+ftPdfRequestId_('payroll')});
   archived=!!saved?.id;if(!archived)throw Error('Keine positive Archivbestätigung.');
  }catch(e){problem=String(e.message||e);}
  FT_PAYROLL_READY={pdf,companyId,month};
  ftPdfOfferDownload_(pdf);
  progress((archived?'Im PDF-Sammelarchiv gespeichert und als Download angeboten.':
   'PDF zum Download angeboten, aber NICHT archiviert: '+problem)+
   (approved<rows.length?' ACHTUNG: '+approved+'/'+rows.length+' Monate freigegeben (VORLÄUFIG).':'')+
   ' · '+pdf.pages+' Seite(n).');
  // Real user click fallback for iOS Safari after asynchronous Google calls.
  if(status&&status.isConnected){
   const manual=document.createElement('button');
   manual.type='button';manual.className='btn primary ft-payroll-download-ready';
   manual.dataset.act='payrollDownloadReady';manual.textContent='PDF herunterladen';
   status.appendChild(manual);
  }
  if(archived)ftPayrollArchive_().catch(err=>console.warn('Buchhaltungsarchiv:',err));
 }catch(e){
  progress('Buchhaltungs-PDF fehlgeschlagen: '+String(e.message||e));
  say('Buchhaltungs-PDF: '+String(e.message||e),true);
 }finally{
  FT_PAYROLL_BUSY=false;
  if(button&&button.isConnected){button.disabled=false;button.textContent='Buchhaltungs-PDF erstellen und archivieren';}
 }
}

async function ftLocalPdf(options={download:true}){

 if(!c?.id)throw Error('Keine Firma ausgewählt.');
 if(batch&&!isAdmin())throw Error('Nur Administratoren dürfen Sammel-PDFs herunterladen.');
 const rawIds=batch?options.userIds:[options.userId||ST.selected||me().id];
 if(!Array.isArray(rawIds)||!rawIds.length)throw Error('Bitte Mitarbeiter auswählen.');
 const ids=[...new Set(rawIds.map(String).filter(Boolean))];
 const progress=typeof options.onProgress==='function'?options.onProgress:ftPdfMessage;
 const records=new Array(ids.length);
 let cursor=0,completed=0;
 await Promise.all(Array.from({length:Math.min(batch?2:1,ids.length)},async()=>{
  while(cursor<ids.length){
   const at=cursor++,id=ids[at];
   const snapshot=await api('report',{companyId:c.id,userId:id,month});
   if(firm()?.id!==c.id||ST.month!==month)throw Error('Monat oder Firma wurde während des Exports geändert.');
   const person=snapshot?.user,report=snapshot?.report;
   if(!person||String(person.id)!==id||!report||
      report.target===undefined||report.worked===undefined||!Array.isArray(snapshot.entries))
    throw Error('Bericht eines Mitarbeiters konnte nicht vollständig geladen werden: '+((ST.h?.users||[]).find(x=>String(x.id)===id)?.name||id));
   const entries=snapshot.entries.filter(x=>String(x.userId)===id&&(!x.companyId||String(x.companyId)===String(c.id)))
     .sort((x,y)=>String(x.start).localeCompare(String(y.start)));
   const status=options.forceStatus||(ST.h?.months||[]).find(x=>String(x.userId)===id&&x.month===month)?.status||'OFFEN';
   const state={APPROVED:'FREIGEGEBEN',FINAL:'ABGESCHLOSSEN',SUBMITTED:'EINGEREICHT',RETURNED:'ZURÜCKGEGEBEN'}[status]||'VORLÄUFIG / OFFEN';
   records[at]={u:person,r:report,entries,state};
   completed++;progress('Berichte geladen: '+completed+' von '+ids.length);
  }
 }));
 let u,r,entries,state;
 const W=595,H=842,S=batch?1.45:2,pages=[];let ctx,y;
 const fmt=n=>Number(n||0).toLocaleString('de-AT',{minimumFractionDigits:2,maximumFractionDigits:2})+' h';
 const euro=n=>Number(n||0).toLocaleString('de-AT',{style:'currency',currency:'EUR'});
 function text(v,x,yy,size=11,bold=false,color='#243449'){

  ctx.fillText(String(v??''),x,yy);

 function newPage(continuation){
  const can=document.createElement('canvas');can.width=W*S;can.height=H*S;

  ctx.setTransform(S,0,0,S,0,0);ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);

  ctx.fillStyle=/^#[0-9a-fA-F]{6}$/.test(c.color||'')?c.color:'#2E9BD5';ctx.fillRect(0,0,9,134);
  text(c.name||'Firma',40,49,21,true,'#ffffff');

async function ftPdfDownload(record,view,batch=false){
 const p={companyId:firm().id,userId:record.userId||ST.selected||me().id,month:record.month||ST.month,id:record.id};
 const chunks=[];let total=null,size=null,name=record.name||'FireTimePro_Monatsbericht.pdf';
 for(let i=0;i<512;i++){
   const r=await api(batch?'pdfBatchChunk':'pdfChunk',{...p,index:i});
   if(r.id!==record.id||r.index!==i||!Number.isInteger(r.total)||r.total<1||r.total>512)throw Error('PDF-Übertragung fehlerhaft.');
   if(total===null){total=r.total;size=r.size;name=r.name||name;}
   else if(total!==r.total||size!==r.size)throw Error('PDF wurde während des Ladens verändert.');
   const raw=atob(r.base64),data=new Uint8Array(raw.length);
   for(let j=0;j<raw.length;j++)data[j]=raw.charCodeAt(j);
   chunks.push(data);
   if(i+1===total)break;
 }
 if(chunks.length!==total)throw Error('PDF unvollständig übertragen.');
 const pdf=new Blob(chunks,{type:'application/pdf'});if(pdf.size!==size)throw Error('PDF-Größe stimmt nicht.');
 const url=URL.createObjectURL(pdf);
 const link=document.createElement('a');link.href=url;link.download=name;link.style.display='none';document.body.appendChild(link);
 try{
   if(view){
     const win=window.open(url,'_blank');
     if(!win){link.click();say('PDF-Anzeige blockiert. Die Datei wird stattdessen heruntergeladen.');}
   }else link.click();
 }finally{
   link.remove();
   setTimeout(()=>URL.revokeObjectURL(url),120000);
 }
}

async function ftAbsencePdfDownload_(id,view){
 const context=ftAbsenceContext_();
 if(!context)return;
 const chunks=[];let total=null,size=null,name='FireTimePro_Abwesenheiten.pdf';
 for(let i=0;i<512;i++){
  const r=await api('absencePdfChunk',{companyId:context.companyId,userId:context.userId,id,index:i});
  if(String(r.id)!==String(id)||r.index!==i||!Number.isInteger(r.total)||r.total<1||r.total>512)
   throw Error('PDF-Übertragung fehlerhaft.');
  if(total===null){total=r.total;size=r.size;name=r.name||name;}
  else if(total!==r.total||size!==r.size)throw Error('PDF-Daten wurden zwischenzeitlich geändert.');
  const raw=atob(r.base64),bytes=new Uint8Array(raw.length);
  for(let j=0;j<raw.length;j++)bytes[j]=raw.charCodeAt(j);
  chunks.push(bytes);
  if(i+1===total)break;
 }
 if(total===null||chunks.length!==total)throw Error('PDF unvollständig übertragen.');
 const file=new Blob(chunks,{type:'application/pdf'});
 if(file.size!==size)throw Error('PDF-Größe stimmt nicht.');
 const url=URL.createObjectURL(file),a=document.createElement('a');
 a.href=url;a.download=name;document.body.appendChild(a);
 try{
  if(view){
   const popup=window.open(url,'_blank');
   if(!popup){a.click();say('PDF-Anzeige blockiert. Download wird gestartet.');}
  }else a.click();
 }finally{
  a.remove();setTimeout(()=>URL.revokeObjectURL(url),120000);
 }
}

function ftStandbyDayAnswer_(item,date){
 if(!item)return false;
 const raw=String(item.day??''),month=date.slice(0,7),day=Number(date.slice(8,10));
 if(item.month&&String(item.month)!==month)return false;
 if(/^\d{4}-\d\d-\d\d$/.test(raw))return raw===date;
 return /^\d{1,2}$/.test(raw)&&Number(raw)===day;
}
function ftStandbyDailyAvailability_(date,staff){
 const staffIds=new Set(staff.map(x=>String(x.id)));
 if(!has('AVAILABILITY'))
  return {yes:staff.slice(),no:[],open:[],submitted:staff.slice(),enabled:false};
 const month=date.slice(0,7),all=ST.h?.availability||[],submissions=ST.h?.availSubmissions||[];
 const sent=new Set(submissions.filter(x=>x.userId&&(!x.month||String(x.month)===month)&&staffIds.has(String(x.userId))).map(x=>String(x.userId)));
 const byUser=new Map();
 for(const item of all){
  if(!staffIds.has(String(item.userId))||!ftStandbyDayAnswer_(item,date))continue;
  byUser.set(String(item.userId),String(item.answer||'').toUpperCase());
 }
 const yes=[],no=[],open=[];
 for(const person of staff){
  if(!sent.has(String(person.id))){open.push(person);continue;}
  const response=byUser.get(String(person.id));
  if(response==='YES')yes.push(person);
  else if(response==='NO')no.push(person);
  else open.push(person);
 }
 return {yes,no,open,submitted:staff.filter(x=>sent.has(String(x.id))),enabled:true};
}

function ftStandbyDayRow_(date,shift,split,staff){

 const allowed=candidates.some(x=>String(x.id)===selected);
 const assigned=staff.find(x=>String(x.id)===selected);
 const splitHtml=split?'<b>Geteilter Dienst – siehe unten</b>':null;
 const selectHtml=splitHtml||'<select class="ft-standby-assign" data-standby="'+E(date)+'" aria-label="Bereitschaft für '+E(date)+' zuweisen">'+
  '<option value="">– Nicht eingeteilt –</option>'+
  (selected&&!allowed?'<option value="'+E(selected)+'" selected>⚠ '+E(assigned?.name||who(selected).name)+' – bisher eingeteilt, Verfügbarkeit nicht bestätigt</option>':'')+
  candidates.map(x=>'<option value="'+E(x.id)+'"'+(selected===String(x.id)?' selected':'')+'>✓ '+E(x.name)+'</option>').join('')+
  (!candidates.length?'<option disabled>– Niemand bestätigt verfügbar –</option>':'')+'</select>';
 const availNames=result.enabled?(
  result.yes.length?'<div class="ft-standby-yes">✓ '+result.yes.map(x=>E(x.name)).join(', ')+'</div>':
   '<div class="ft-standby-none">Keine bestätigte Verfügbarkeit</div>'
 ):'<div class="ft-standby-yes">Verfügbarkeitsmodul nicht aktiv – alle Mitarbeiter wählbar</div>';
 const details=result.enabled?'<details class="ft-standby-details"><summary>'+
  result.yes.length+' verfügbar · '+result.no.length+' nicht verfügbar · '+result.open.length+' offen</summary>'+
  (result.no.length?'<div>✕ Nicht verfügbar: '+result.no.map(x=>E(x.name)).join(', ')+'</div>':'')+
  (result.open.length?'<div>◷ Noch nicht abgegeben/offen: '+result.open.map(x=>E(x.name)).join(', ')+'</div>':'')+
  '</details>':'';
 const warning=result.enabled&&selected&&!allowed?'<div class="ft-standby-unsafe">⚠ Vorhandene Einteilung ohne bestätigte Verfügbarkeit – bitte prüfen.</div>':'';
 const selectedName=selected?assigned?.name||who(selected).name:'';
 const assignedLine=!split&&selected?
  '<div class="ft-standby-current">Eingeteilt: <strong>'+E(selectedName)+'</strong></div>':'';
 return '<tr><td><strong>'+E(ftRosterDate_(date))+'</strong></td>'+
  '<td class="ft-standby-avail-cell">'+availNames+details+'</td>'+
  '<td>'+selectHtml+assignedLine+warning+'</td>'+
  '<td data-standby-status="1">'+E(ftStandbyStatusText_(shift?.status))+'</td></tr>';
}

 html+='<div class="ft-plan-actions"><button class="btn" type="button" data-act="planFinalize"'+(flow.gaps?' disabled':'')+'>'+
   (fixed?'Festlegung erneut bestätigen':'1. Plan festlegen')+'</button>'+
  '<button class="btn primary" type="button" data-act="planPublish"'+(!fixed||published?' disabled':'')+'>2. Plan veröffentlichen</button>'+
  '<button class="btn" type="button" data-act="planCalendarShare"'+(!fixed||!published||shared||!flow.calendarEnabled?' disabled':'')+'>3. Im Kalender teilen & Einladungen senden</button></div>'+
  '<div class="ft-plan-message '+(stale||flow.shareStatus==='PARTIAL'?'ft-plan-warning':'')+'">'+E(status)+'</div>'+
  (flow.sharedAt?'<p class="ft-plan-audit">Letzter Kalenderabgleich: '+date(flow.sharedAt)+
    ' · Bearbeitete Termine: '+E(flow.calendarEvents||0)+

  (!flow.calendarEnabled?'<p class="ft-plan-audit">Kalenderfreigabe benötigt das aktivierte Google-Kalender-Modul und eine gültige Kalender-ID.</p>':'')+

/** Display only relevant duty actions first; never mutate shift records while rendering. */
function ftStandbyCard_(x,sickLeaves,group){
 const start=Date.parse(x.start),end=Date.parse(x.end),now=Date.now();
 const done=x.actualStatus==='DONE',due=!done&&end<=now;
 const live=!done&&start<=now&&end>now;
 const type=done?'done':due?'due':live?'live':'planned';
 const label=done?'Geleistet':due?'Bestätigung offen':live?'Läuft gerade':'Geplant';
 const title=isAdmin()?E(who(x.userId).name):'Meine Bereitschaft';
 const sick=(sickLeaves||[]).some(y=>String(y.userId)===String(x.userId)&&y.status!=='REJECTED'&&
  Date.parse(y.from)<end&&Date.parse(y.to)>start);
 const button=due&&(isAdmin()||String(x.userId)===String(me().id))?
  '<button type="button" class="btn primary ft-duty-confirm" data-act="'+(x.segment?'segmentDone':'shiftDone')+
  '" data-id="'+E(x.id)+'" aria-label="'+title+' vom '+E(DT(x.start))+' als geleistet bestätigen">✓ Dienst bestätigen</button>':'';
 return '<article class="ft-duty-item ft-duty-'+type+'" data-duty-group="'+group+'">'+
  '<div class="ft-duty-item-top"><strong>'+title+'</strong><span class="ft-duty-status ft-duty-status-'+type+'">'+label+'</span></div>'+
  '<div class="ft-duty-dates"><div><span>Beginn</span><b>'+E(DT(x.start))+' Uhr</b></div>'+
  '<div><span>Ende</span><b>'+E(DT(x.end))+' Uhr</b></div></div>'+
  (sick?'<p class="ft-duty-warning">⚠ Krankenstand / Vertretung vor der Bestätigung prüfen.</p>':'')+
  (button?'<div class="ft-duty-item-actions">'+button+'</div>':'')+'</article>';
}
function ftStandbySections_(all,sickLeaves,full){
 const now=Date.now();
 const valid=(all||[]).filter(x=>Number.isFinite(Date.parse(x.start))&&Number.isFinite(Date.parse(x.end)));
 const due=valid.filter(x=>x.actualStatus!=='DONE'&&Date.parse(x.end)<=now).sort((a,b)=>
  (String(a.userId)===String(me().id)?0:1)-(String(b.userId)===String(me().id)?0:1)||
  Date.parse(a.end)-Date.parse(b.end));
 const live=valid.filter(x=>x.actualStatus!=='DONE'&&Date.parse(x.start)<=now&&Date.parse(x.end)>now)
  .sort((a,b)=>Date.parse(a.start)-Date.parse(b.start));
 const future=valid.filter(x=>x.actualStatus!=='DONE'&&Date.parse(x.start)>now)
  .sort((a,b)=>Date.parse(a.start)-Date.parse(b.start));
 const done=valid.filter(x=>x.actualStatus==='DONE').sort((a,b)=>Date.parse(b.end)-Date.parse(a.end));
 const cards=(rows,group)=>'<div class="ft-duty-list">'+rows.map(x=>ftStandbyCard_(x,sickLeaves,group)).join('')+'</div>';
 const more=(rows,group,text)=>rows.length?'<details class="ft-duty-more"><summary>'+E(text)+' ('+
  rows.length+')</summary>'+cards(rows,group)+'</details>':'';
 return '<section class="card ft-duty-section" id="ft-duty-confirmations">'+
  '<div class="ft-duty-section-head"><div><span class="ft-duty-eyebrow">'+E(ftPdfMonthLabel(ST.month))+'</span>'+
  '<h2>Bereitschaften & Bestätigungen</h2>'+
  '<p class="muted small">'+(full?'Firmenübersicht':'Meine Dienstübersicht')+
  ' · Dienstbestätigung direkt beim jeweiligen Abschnitt</p></div>'+
  '<span class="ft-duty-count'+(due.length?' has-due':'')+'">'+
  (due.length?due.length+' offen':'Alles bestätigt')+'</span></div>'+
  (due.length?'<h3 class="ft-duty-subhead">Jetzt bestätigen</h3>'+cards(due.slice(0,5),'due')+
   more(due.slice(5),'due','Weitere offene Bestätigungen'):
   '<p class="ft-duty-empty">✓ Keine abgeschlossenen, unbestätigten Dienste in diesem Monat.</p>')+
  (live.length?'<h3 class="ft-duty-subhead">Laufende Dienste</h3>'+cards(live.slice(0,3),'live')+
   more(live.slice(3),'live','Weitere laufende Dienste'):'')+
  '<h3 class="ft-duty-subhead">Als Nächstes ('+future.length+')</h3>'+
  (future.length?cards(future.slice(0,3),'future')+more(future.slice(3),'future','Weitere geplante Dienste'):
   '<p class="ft-duty-empty">Keine weiteren bevorstehenden Dienste in diesem Monat.</p>')+
  (done.length?'<details class="ft-duty-more ft-duty-done-history"><summary>✓ Bereits bestätigt ('+
   done.length+')</summary>'+cards(done,'done')+'</details>':'')+
  ((all||[]).length>valid.length?'<p class="ft-duty-warning">⚠ Ein Dienst hat unklare Zeitangaben.</p>':'')+
 '</section>';
}


/* Lesbare Monatsübersicht wie bei der Verfügbarkeit: Ansicht, keine Planänderung. */
function ftRosterDate_(date){
 const m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(String(date||''));
 return m?m[3]+'.'+m[2]+'.'+m[1]:String(date||'');
}
function ftRosterDayAssignments_(day){
 const month=day.slice(0,7),admin=isAdmin();
 const base=(ST.h?.shifts||[]).filter(x=>x.day===day&&(admin||x.status==='PUBLISHED'));
 const allocations=ST.h?.segments||[];
 const result=[];
 for(const shift of base){
  if(!shift.userId)continue;
  const divided=allocations.filter(x=>String(x.shiftId)===String(shift.id));
  const rows=divided.length?divided:[shift];
  for(const part of rows){
   if(!part.userId)continue;
   result.push({name:who(part.userId).name,userId:part.userId,start:part.start,end:part.end,
    status:shift.status,split:divided.length>0});
  }
 }
 return result.sort((a,b)=>Date.parse(a.start)-Date.parse(b.start));
}
function ftRosterDayDetail_(day){
 if(!/^\d{4}-\d\d-\d\d$/.test(String(day||''))||day.slice(0,7)!==ST.month)return '';
 const entries=ftRosterDayAssignments_(day);
 return '<div class="ft-roster-detail-header"><strong>'+E(ftRosterDate_(day))+'</strong><span>'+
 (entries.length?entries.length+' Einteilung'+(entries.length===1?'':'en'):'Keine Bereitschaft eingeteilt')+'</span></div>'+
 (entries.length?entries.map(x=>'<div class="ft-roster-detail-line"><b>'+E(x.name)+'</b>'+
 '<span>'+E(DT(x.start))+' – '+E(DT(x.end))+' Uhr'+(x.status!=='PUBLISHED'?' · Entwurf':'')+
 (x.split?' · Geteilter Dienst':'')+'</span></div>').join(''):
 '<p class="muted small">Für diesen Tag ist noch niemand eingeteilt beziehungsweise veröffentlicht.</p>');
}
function ftRosterMonthGrid_(){
 if(!has('STANDBY'))return '';
 const [year,m]=ST.month.split('-').map(Number),offset=(new Date(year,m-1,1).getDay()+6)%7;
 const weekdays=['Mo','Di','Mi','Do','Fr','Sa','So'];
 const today=ftTimeToday_();
 const cells=Array.from({length:days(ST.month)},(_,i)=>{
  const day=ST.month+'-'+String(i+1).padStart(2,'0');
  const entries=ftRosterDayAssignments_(day);
  const mine=entries.some(x=>String(x.userId)===String(me().id));
  const allDraft=entries.length&&entries.every(x=>x.status!=='PUBLISHED');
  const names=[...new Set(entries.map(x=>x.name))];
  const first=names[0]||'';
  const short=first.split(/\s+/).slice(-1)[0]||first;
  const aria=ftRosterDate_(day)+': '+(names.length?names.join(', '):'Nicht besetzt');
  const className=mine?' own':entries.length?' assigned':' empty';
  return '<button type="button" class="ft-roster-day'+className+(allDraft?' draft':'')+
   (day===today?' today':'')+'" data-act="rosterInspect" data-id="'+E(day)+'" aria-label="'+E(aria)+
   '" title="'+E(aria)+'"><span class="ft-roster-date-full">'+E(ftRosterDate_(day))+'</span>'+
   '<span class="ft-roster-date-short">'+(i+1)+'.</span>'+
   '<span class="ft-roster-name">'+(entries.length?E(short)+(names.length>1?' +'+(names.length-1):''):'–')+'</span>'+
   (mine?'<span class="ft-roster-mine">Mein Dienst</span>':allDraft?'<span class="ft-roster-draft">Entwurf</span>':'')+
   '</button>';
 }).join('');
 return '<section class="card ft-roster-month"><div class="ft-roster-head"><div>'+
  '<h2>Bereitschaftskalender · '+E(ftPdfMonthLabel(ST.month))+'</h2>'+
  '<p class="muted small">Tag antippen → Einteilung ansehen</p>'+
  '</div><div class="ft-roster-legend"><span>● Eingeteilt</span><span>● Mein Dienst</span></div></div>'+
  '<div class="ft-roster-grid" role="group" aria-label="Bereitschaften '+E(ftPdfMonthLabel(ST.month))+'">'+
  weekdays.map(x=>'<div class="ft-roster-weekday">'+x+'</div>').join('')+
  Array(offset).fill('<span class="ft-roster-blank" aria-hidden="true"></span>').join('')+
  cells+'</div><div class="ft-roster-detail" id="ftRosterInfo" aria-live="polite">'+
  '<p class="muted small">Wähle einen Kalendertag aus, um die vollständige Einteilung zu sehen.</p></div></section>';
}

function standby(){
 const c=firm(),list=ST.h.shifts||[],parts=shiftAllocations(),changes=ST.h.changes||[],sickLeaves=ST.h.sick||[];
 const full=isAdmin(),own=parts.filter(x=>x.userId===me().id),mineOrAll=full?parts:parts.filter(x=>x.userId===me().id);

 const partOptions=proposalParts.map(x=>`<option value="${E(x.shiftId)}" data-from="${E(x.userId)}" data-start="${E(stampInput(x.start))}" data-end="${E(stampInput(x.end))}">${E(who(x.userId).name)} · ${DT(x.start)} – ${DT(x.end)}</option>`).join('');

 `<details class="card ft-duty-details"><summary>Bereitschaft tauschen oder übergeben</summary><div class="ft-duty-details-body"><p class="muted">Du kannst den gesamten Dienst oder nur einen Zeitraum an einen Kollegen übergeben. Die Übernahme wird erst nach dessen Zustimmung wirksam.</p>${proposalParts.length?`<form id="handoverForm"><label class="field"><span>Mein Dienstabschnitt</span><select name="shiftId" id="handoverShift" required>${partOptions}</select></label><input type="hidden" name="fromUserId" value="${E(first?.userId||'')}"><div class="cols">${input('Übergabe ab','start',stampInput(first?.start),'datetime-local','required')}${input('Übergabe bis','end',stampInput(first?.end),'datetime-local','required')}${select('toUserId','Kollege übernimmt',targets.filter(x=>x.id!==first?.userId).map(x=>[x.id,x.name]),'')}</div>${input('Grund / Hinweis (optional)','reason','')}<button class="btn primary">Übernahme anfragen</button></form>`:'<p>Kein noch offener, übergebbarer Dienstabschnitt vorhanden.</p>'}</div></details>`+
 `<div class="card"><h2>Offene Übernahmen</h2>${requests.map(x=>`<div class="card"><b>${E(who(x.fromUserId).name)} → ${E(who(x.toUserId).name)}</b><div>${DT(x.start)} – ${DT(x.end)}</div><p class="muted small">${E(x.reason||'Ohne Kommentar')}</p>${x.toUserId===me().id||full?`<button class="btn primary" data-act="handoverAccept" data-id="${E(x.id)}">Übernehmen</button><button class="btn danger" data-act="handoverDecline" data-id="${E(x.id)}">Ablehnen</button>`:'Warten auf Zustimmung des Kollegen'}</div>`).join('')||'Keine offenen Übernahmen.'}</div>`+
 `<details class="card ft-duty-details"><summary>Bisherige Übergaben</summary><div class="ft-duty-details-body">${changes.filter(x=>x.status!=='PENDING').map(x=>`<div class="row between"><span>${E(who(x.fromUserId).name)} → ${E(who(x.toUserId).name)} · ${DT(x.start)} – ${DT(x.end)}</span><b>${x.status==='ACCEPTED'?'✓ Angenommen':'Abgelehnt'}</b></div>`).join('')||'Noch keine Übergaben.'}</div></details>`;

async function ftCommPhotoData_(input){
 const file=input?.files?.[0];if(!file)return null;
 const pdf=file.type==='application/pdf'||/\.pdf$/i.test(file.name||'');
 if(pdf){
  if(file.size<8||file.size>2*1000*1000)
   throw Error('PDF-Anhang: maximal 2 MB. Größere mehrseitige PDFs bitte vorher verkleinern.');
  const bytes=new Uint8Array(await file.arrayBuffer());
  if(String.fromCharCode(...bytes.slice(0,5))!=='%PDF-')
   throw Error('Die Datei ist kein gültiges PDF.');
  let raw='';for(let i=0;i<bytes.length;i+=16384)
   raw+=String.fromCharCode(...bytes.subarray(i,i+16384));
  return {mime:'application/pdf',data:btoa(raw),name:file.name.slice(0,90)};
 }
 if(!['image/jpeg','image/png'].includes(file.type)||file.size>8*1024*1024)
  throw Error('Bitte ein JPG-/PNG-Foto bis 8 MB oder PDF bis 2 MB auswählen.');
 const obj=URL.createObjectURL(file);
 try{
  const img=new Image();
  await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(Error('Bild kann nicht gelesen werden.'));img.src=obj;});
  let factor=Math.min(1,1000/Math.max(img.naturalWidth,img.naturalHeight));
  for(let n=0;n<6;n++){
   const canvas=document.createElement('canvas');
   canvas.width=Math.max(1,Math.round(img.naturalWidth*factor));
   canvas.height=Math.max(1,Math.round(img.naturalHeight*factor));
   const ctx=canvas.getContext('2d');if(!ctx)throw Error('Foto konnte nicht bearbeitet werden.');
   ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0);
   const encoded=canvas.toDataURL('image/jpeg',Math.max(.45,.8-n*.065)).split(',')[1]||'';
   if(encoded.length<870000)return {mime:'image/jpeg',data:encoded,name:file.name};
   factor*=.78;
  }
  throw Error('Das Foto ist zu groß. Bitte ein kleineres Foto auswählen.');
 }finally{URL.revokeObjectURL(obj);}
}

function ftCommUpdateLocalTask_(threadId,status,result={}){
 if(!ST.comm)return;
 const thread=ST.comm.threads?.find(t=>String(t.id)===String(threadId));
 if(thread){thread.status=status;thread.updatedAt=result.updatedAt||new Date().toISOString();thread.unread=false;}
 const summary=ST.comm.taskOverview?.find(t=>String(t.id)===String(threadId));
 if(summary){summary.status=status;summary.updatedAt=thread?.updatedAt||summary.updatedAt;
  if(status==='DONE')summary.evidence=true;}
 if(result.evidenceReply){
  ST.comm.replies=ST.comm.replies||[];
  if(!ST.comm.replies.some(r=>r.id===result.evidenceReply.id))
   ST.comm.replies.push(result.evidenceReply);
 }
 page();
}
