const INVITE=new URLSearchParams(location.search).get('invite') || '';

const ST={token:sessionStorage.getItem('ft_token')||'',cid:'',h:null,tab:'dashboard',month:monthOf(new Date()),rules:null,brand:null,logoNew:'',avail:{},availMonth:'',edit:'',selected:'',invite:/^[a-f0-9]{64}$/.test(INVITE)};

const E=v=>String(v==null?'':v).replace(/[&<>"']/g,k=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[k]));
const app=document.getElementById('app');
const N=v=>Number(v||0).toLocaleString('de-AT',{maximumFractionDigits:2});

const DT=v=>{if(!v)return '–';const d=new Date(v);return Number.isFinite(d.getTime())?d.toLocaleString('de-AT',{dateStyle:'short',timeStyle:'short'}):'–';};
function monthOf(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function nextMonth(m){const [y,n]=m.split('-').map(Number);return monthOf(new Date(y,n,1));}
function days(m){const [y,n]=m.split('-').map(Number);return new Date(y,n,0).getDate();}
function validClock(value,fallback='08:00'){
  const t=String(value||'').trim();
  if(/^([01]\d|2[0-3]):[0-5]\d$/.test(t))return t;
  if(/^\d{4}-\d\d-\d\dT\d\d:\d\d/.test(t)){
    const d=new Date(t);
    if(Number.isFinite(d.getTime()))return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  }
  return fallback;
}
function shiftedEnd(start,hours){
  const matched=/^(\d{4})-(\d{2})-(\d{2})T([01]\d|2[0-3]):([0-5]\d)$/.exec(String(start||''));
  if(!matched)return '';
  const [_,y,m,day,h,min]=matched;
  const d=new Date(Number(y),Number(m)-1,Number(day),Number(h),Number(min));
  const n=Number(hours);
  if(!Number.isFinite(d.getTime())||!Number.isFinite(n)||n<=0)return '';
  d.setTime(d.getTime()+n*3600000);
  return stampInput(d);
}
function stampInput(s){
  if(!s)return '';
  const d=s instanceof Date?s:new Date(s);
  if(!Number.isFinite(d.getTime()))return '';
  const z=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'T'+z(d.getHours())+':'+z(d.getMinutes());
}
function say(s,bad=false){const el=document.getElementById('toast');el.textContent=s;el.className='toast'+(bad?' bad':'');clearTimeout(window.ftHide);window.ftHide=setTimeout(()=>el.className='toast hide',6500);}
async function rpc(name,...args){
  const endpoint=String(window.FT_API_URL||'');
  if(!/^https:\/\/[^/]+\/api$/.test(endpoint)||endpoint.includes('DEIN-WORKER')){
    throw Error('Cloudflare-Adresse fehlt in config.js.');
  }
  let request;
  switch(name){
    case 'ft_login': request={type:'login',email:args[0],password:args[1]};break;
    case 'ft_activate': request={type:'activate',invite:args[0],password:args[1]};break;
    case 'ft_logout': request={type:'logout',token:args[0]};break;
    case 'ft_changePassword': request={type:'password',token:args[0],current:args[1],next:args[2]};break;
    case 'ft_brandForLogin':request={type:'brand',slug:args[0]};break;
    case 'ft_api':request={type:'api',token:args[0],action:args[1],data:args[2]||{}};break;
    default:throw Error('Nicht freigegebener API-Aufruf: '+name);
  }
  const response=await fetch(endpoint,{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(request),cache:'no-store',credentials:'omit'
  });
  let data;try{data=await response.json();}catch(e){throw Error('Die API liefert keine gültige Antwort.');}
  if(!response.ok||!data.ok)throw Error(data.error||'Fehler beim Serveraufruf.');
  return data.data;
}
function api(action,p={}){
  const startedContext=(firm()?.id||'SYS')+'|'+ST.month+'|'+ST.tab;
  const result=rpc('ft_api',ST.token,action,p);
  const readOnly=new Set(['home','report','licenseGet','profileGet','rulesGet','audit','shiftPeriodSummary','calendarTest','userInvite','remindOne']);
  if(readOnly.has(action))return result;
  return result.then(value=>{
    // Nach Schreibzugriff dürfen zuvor geöffnete Ansichten nicht als frisch gelten.
    // Der aktuelle Tab kann sofort lokal aktualisiert werden (z. B. Mitarbeiteranlage).
    const context=(firm()?.id||'SYS')+'|'+ST.month;
    const current=context+'|'+ST.tab;
    FT_VIEWS_LOADED.clear();FT_VIEW_FETCHED_AT.clear();
    if(startedContext===current){FT_VIEWS_LOADED.add(current);FT_VIEW_FETCHED_AT.set(current,performance.now());}
    if(action==='licenseSave'||action==='profileSave'||action==='companyUpdate'||action==='onboard'){
      ST.rules=null;FT_RULES_KEY='';
    }
    return value;
  });
}
async function run(cb,message){try{const x=await cb();if(message)say(message);return x;}catch(e){say(e.message,true);return null;}}
const me=()=>ST.h?.me||null,firm=()=>ST.h?.company||null,has=m=>!!ST.h?.modules?.includes(m),isAdmin=()=>!!me()&&me().role!=='STAFF';
const myUsers=()=>ST.h.users,who=id=>myUsers().find(x=>x.id===id)||(ST.h.directory||[]).find(x=>x.id===id)||{name:'Unbekannt'};
function theme(color,second){if(/^#[0-9a-f]{6}$/i.test(color||''))document.documentElement.style.setProperty('--accent',color);if(/^#[0-9a-f]{6}$/i.test(second||''))document.documentElement.style.setProperty('--secondary',second);}
function input(text,name,value='',type='text',extra=''){return `<label class="field"><span>${E(text)}</span><input name="${E(name)}" value="${E(value)}" type="${type}" ${extra}></label>`;}
function select(name,label,options,value){return `<label class="field"><span>${E(label)}</span><select name="${E(name)}">${options.map(o=>`<option value="${E(o[0])}" ${String(value)===String(o[0])?'selected':''}>${E(o[1])}</option>`).join('')}</select></label>`;}
function optionsUsers(name='userId',selected=''){return select(name,'Mitarbeiter',myUsers().filter(u=>u.status==='ACTIVE').map(u=>[u.id,u.name]),selected||me().id);}
function hint(t){return `<div class="help">ℹ ${t}</div>`;}
function monthPick(){return `<div class="actions"><label>Monat: <input type="month" id="monthPick" style="width:180px" value="${E(ST.month)}"></label></div>`;}
function chk(name,label,checked,desc=''){return `<label class="cbox"><input type="checkbox" name="${E(name)}" ${checked?'checked':''}><span><b>${E(label)}</b>${desc?`<div class="muted small">${E(desc)}</div>`:''}</span></label>`;}
function fields(form){const p=Object.fromEntries(new FormData(form).entries());form.querySelectorAll('input[type=checkbox]').forEach(x=>{if(!['module','nightTypes','sundayTypes','holidayTypes'].includes(x.name))p[x.name]=x.checked;});return p;}
function auth(){const activate=ST.invite&&/^[a-f0-9]{64}$/.test(INVITE);app.innerHTML=`<div class="login-wrap"><div class="login"><div class="brand" style="text-align:center"><em>♨</em> FireTime Pro</div>${ST.brand?`<p style="text-align:center">${ST.brand.logo?`<img class="logo" src="${ST.brand.logo}">`:''}<br><b>${E(ST.brand.name)}</b></p>`:''}<p class="muted" style="text-align:center">Personal · Arbeitszeit · Dienstplanung</p>${activate?`<h2>Zugang aktivieren</h2><form id="activateForm">${input('Neues Passwort (mindestens 12 Zeichen)','password','','password','required minlength="12"')}<button class="btn primary" style="width:100%">Aktivieren</button></form><button class="btn" data-act="normalLogin">Zur Anmeldung</button>`:`<h2>Anmelden</h2><form id="loginForm">${input('E-Mail-Adresse','email','','email','required')}${input('Passwort','password','','password','required')}<button class="btn primary" style="width:100%">Anmelden</button></form>`}<p class="muted small" style="text-align:center">Developed by Michael Mejtsky</p></div></div>`;}
async function load(){
  if(!ST.token){ST.h=null;auth();return;}
  const loadSeq=++FT_LOAD_SEQ, loadStart=performance.now();
  const requestedTab=ST.tab, requestedMonth=ST.month, requestedCid=ST.cid;
  // Ein einziges signiertes home-Paket fuer die eigene Mitarbeiteroberflaeche.
  // Daten bleiben nur im RAM, firmenspezifisch und maximal 30 s frisch.
  // Administratoransichten ausserhalb des ersten Firmenaufrufs bleiben gezielt.
  const bulkRead=Boolean(SLUG||requestedCid||ST.h?.company?.id)&&
    (ST.h?.me?.role==='STAFF'||!ST.h)&&!['rules','reports'].includes(requestedTab);
  try{
    const home=await api('home',{month:requestedMonth,companyId:requestedCid,
      view:bulkRead?'all':requestedTab,
      reportsMode:bulkRead?'self':requestedTab==='reports'?'selected':requestedTab==='dashboard'?'self':'none',
      userId:requestedTab==='reports'?ST.selected:''});
    if(loadSeq!==FT_LOAD_SEQ || requestedTab!==ST.tab || requestedMonth!==ST.month || requestedCid!==ST.cid)return;
    console.info('[FireTime Tempo]',requestedTab,Math.round(performance.now()-loadStart)+' ms API+Verbindung');
    if(!home||!home.me)throw Error('Sitzung oder Benutzerdaten ungültig.');
    // Preserve sections already fetched in the same company/month, do not mix customer data.
    const context=(home.company?.id||'SYS')+'|'+home.month;
    const same=FT_LAST_CONTEXT===context&&ST.h?.me?.id===home.me.id;
    const view=ST.tab;
    const fresh={
      dashboard:['shifts','workShifts','reports'],staff:[],time:['activities'],
      reports:['months','reports'],leave:['leaves'],work:['workShifts'],
      standby:['shifts','segments','changes','sick','availability','availSubmissions'],sick:['sick'],
      availability:['availability','availSubmissions'],rules:[],settings:[],
      license:[],customers:[],profile:[]
    }[view]||[];
    if(same&&!bulkRead){
      if(!home.logo&&ST.h.logo)home.logo=ST.h.logo;
      for(const k of ['activities','availability','availSubmissions','shifts','segments','changes','sick','workShifts','leaves','months','reports']){
        if(!fresh.includes(k))home[k]=ST.h[k];
      }
    } else if(!same){FT_VIEWS_LOADED.clear();FT_VIEW_FETCHED_AT.clear();}
    FT_LAST_CONTEXT=context;
    ST.h=home;
    FT_VIEWS_LOADED.add(context+'|'+view);
    FT_VIEW_FETCHED_AT.set(context+'|'+view,performance.now());
    if(bulkRead){
      const bundled=['dashboard','staff','time','leave','sick','work','standby',
        'availability','profile','settings','customers','license'];
      // Im Mitarbeiterbereich ist der eigene Monatsbericht im Paket enthalten.
      // Bei Administratoren muss ein anderer Mitarbeiter gezielt geladen werden.
      if(home.me?.role==='STAFF')bundled.push('reports');
      const stamp=performance.now();
      for(const tab of bundled){
        FT_VIEWS_LOADED.add(context+'|'+tab);
        FT_VIEW_FETCHED_AT.set(context+'|'+tab,stamp);
      }
      console.info('[FireTime Tempo] Alle Mitarbeiteransichten gebuendelt: '+bundled.length+' Menues.');
    }
    ST.h.segments=ST.h.segments||[];ST.h.changes=ST.h.changes||[];ST.h.sick=ST.h.sick||[];
    if(me().role==='SYSADMIN'&&!ST.cid&&!['dashboard','customers','profile'].includes(ST.tab))ST.tab='dashboard';
    if(ST.tab==='rules'&&firm()){
      const key=firm().id+'|'+ST.month;
      if(!ST.rules||FT_RULES_KEY!==key){
        ST.rules=await api('rulesGet',{companyId:firm().id,month:ST.month});
        if(loadSeq!==FT_LOAD_SEQ)return;
        FT_RULES_KEY=key;
      }
    }
    if(firm()?.slug)try{localStorage.setItem('ft_last_firm_slug',firm().slug);}catch(_){} 
    theme(firm()?.color||ST.brand?.color||'#f37850',ST.h.profile?.secondaryColor||ST.brand?.secondaryColor||'#172c44');
    render();

async function ftPdfDownload(record,view){
 const p={companyId:firm().id,userId:record.userId||ST.selected||me().id,month:record.month||ST.month,id:record.id};
 const chunks=[];let total=null,size=null,name=record.name||'FireTimePro_Monatsbericht.pdf';
 for(let i=0;i<512;i++){
   const r=await api('pdfChunk',{...p,index:i});
   if(r.id!==record.id||r.index!==i||!Number.isInteger(r.total)||r.total<1||r.total>512)throw Error('PDF-Übertragung fehlerhaft.');
   if(total===null){total=r.total;size=r.size;name=r.name||name;}
   else if(total!==r.total||size!==r.size)throw Error('PDF wurde während des Ladens verändert.');
   const raw=atob(r.base64),data=new Uint8Array(raw.length);
   for(let j=0;j<raw.length;j++)data[j]=raw.charCodeAt(j);
   chunks.push(data);
   if(i+1===total)break;
 }
 if(chunks.length!==total)throw Error('PDF unvollständig übertragen.');
 const pdf=new Blob(chunks,{type:'application/pdf'});if(pdf.size!==size)throw Error('PDF-Größe stimmt nicht.');
 const url=URL.createObjectURL(pdf);
 const link=document.createElement('a');link.href=url;link.download=name;
 if(view){const win=window.open(url,'_blank');if(!win){link.click();say('Popup blockiert: PDF wurde heruntergeladen.');}}
 else link.click();
 setTimeout(()=>URL.revokeObjectURL(url),60000);
}

if(form.getAttribute('id')==='loginForm')return run(async()=>{const result=await rpc('ft_login',p.email,p.password);FT_VIEWS_LOADED.clear();FT_VIEW_FETCHED_AT.clear();FT_RULES_KEY='';ST.rules=null;ST.selected='';ST.h=null;ST.token=result.token;sessionStorage.setItem('ft_token',result.token);ST.cid='';ST.tab='dashboard';await load();},'Angemeldet.');
if(form.getAttribute('id')==='activateForm')return run(async()=>{await rpc('ft_activate',INVITE,p.password);ST.invite=false;auth();},'Zugang aktiviert.');
if(form.getAttribute('id')==='onboardForm')return run(async()=>{p.logoData=ST.logoNew;p.modules=[...form.querySelectorAll('[name="module"]:checked')].map(x=>x.value);const result=await api('onboard',p);ST.logoNew='';ST.cid=result.company.id;ST.tab='settings';await load();say('Kunde angelegt. '+(result.warnings||[]).join(' '),result.warnings?.length>0);},'Firma angelegt.');
if(form.getAttribute('id')==='licenseForm')return run(async()=>{p.companyId=firm().id;p.modules=[...form.querySelectorAll('[name="module"]:checked')].map(x=>x.value);await api('licenseSave',p);await load();},'Module freigeschaltet.');
if(form.getAttribute('id')==='staffForm'){
  if(form.dataset.saving==='1')return;
  form.dataset.saving='1';
  const submitButton=form.querySelector('button.btn.primary');
  if(submitButton){submitButton.disabled=true;submitButton.textContent='Wird gespeichert …';}
  try{
    const updated=Boolean(p.id);
    const result=updated
      ?await api('userUpdate',p)
      :await api('userCreate',{...p,companyId:firm().id,deferInvite:true});
    const user=updated?result:result.user;
    if(!user||!user.id)throw Error('Google hat keine Mitarbeiter-ID zurueckgegeben. Bitte Mitarbeiterliste pruefen.');
    if(!Array.isArray(ST.h.users))ST.h.users=[];
    const i=ST.h.users.findIndex(x=>x.id===user.id);
    if(i>=0)ST.h.users[i]=user;
    else ST.h.users.push(user);
    ST.edit='';page();
    say(updated?'Mitarbeiteränderung gespeichert.':'Mitarbeiter angelegt. Einladung wird getrennt versendet.');
    if(!updated){
      // E-Mail nicht in die Speicher-Transaktion hineinziehen: dadurch
      // bleibt der Mitarbeiter bei E-Mail-Fehlern trotzdem gespeichert.
      api('userInvite',{id:user.id})
        .then(()=>say('Mitarbeiter gespeichert und Einladung verschickt.'))
        .catch(err=>say('Mitarbeiter ist gespeichert. Einladung nicht bestätigt: '+err.message+' – über „Einladung senden“ erneut versuchen.',true));
    }
  }catch(err){
    const message=String(err?.message||'Speichern fehlgeschlagen.');
    say(message.includes('E-Mail ist bereits')
      ?message+' Bitte erst die Mitarbeiterliste prüfen, bevor du erneut anlegst.'
      :message,true);
  }finally{
    form.dataset.saving='0';
    if(submitButton){submitButton.disabled=false;submitButton.textContent='Speichern';}
  }
  return;
}

if(form.getAttribute('id')==='handoverForm')return run(async()=>{
 if(p.toUserId===p.fromUserId)throw Error('Bitte einen anderen Kollegen auswählen.');
 await api('handoverRequest',{...p,companyId:firm().id});await load();
 },'Übernahme angefragt. Der Kollege kann am Handy zustimmen.');
if(form.getAttribute('id')==='sickForm')return run(async()=>{
 const result=await api('sickReport',{...p,companyId:firm().id});await load();
 say((result.message||'Krankenstand gemeldet.')+(result.warning?' '+result.warning:''),!!result.warning);
 },'Krankenstand gespeichert.');
if(form.getAttribute('id')==='timeForm')return run(async()=>{await api('activitySave',{...p,companyId:firm().id});ST.edit='';await load();},'Arbeitszeit gespeichert.');
if(form.getAttribute('id')==='leaveForm')return run(async()=>{await api('leaveRequest',{...p,companyId:firm().id});await load();},'Urlaub beantragt.');
if(form.getAttribute('id')==='workForm')return run(async()=>{await api('workSave',{...p,companyId:firm().id});await load();},'Dienst als Entwurf gespeichert.');
if(form.getAttribute('id')==='settingsForm')return run(async()=>{await api('companyUpdate',{...p,id:firm().id});await load();},'Firmeneinstellungen gespeichert.');
if(form.getAttribute('id')==='profileForm')return run(async()=>{await api('profileSave',{...p,companyId:firm().id});await load();},'Arbeitsmodell gespeichert.');
if(form.getAttribute('id')==='rulesForm')return run(async()=>{const types={};['nightTypes','sundayTypes','holidayTypes'].forEach(k=>types[k]=[...form.querySelectorAll(`[name="${k}"]:checked`)].map(x=>x.value));await api('rulesSave',{...p,...types,companyId:firm().id});ST.rules=null;FT_RULES_KEY='';ST.month=p.effectiveMonth;await load();},'Neue Zuschlagsregel gespeichert.');
if(form.getAttribute('id')==='passwordForm')return run(async()=>{await rpc('ft_changePassword',ST.token,p.current,p.next);ST.token='';sessionStorage.removeItem('ft_token');auth();},'Passwort geändert. Bitte neu anmelden.');
}
async function fileAsData(file){if(!file)return null;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>2*1024*1024){say('Logo: PNG/JPG/WEBP maximal 2 MB.',true);return null;}return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result));reader.onerror=()=>reject(Error('Datei nicht lesbar.'));reader.readAsDataURL(file);});}
async function uploadFile(input){const str=await fileAsData(input.files[0]);if(!str)return;if(input.id==='newLogo'){ST.logoNew=str;const el=document.getElementById('newLogoLabel');if(el)el.textContent='Ausgewählt: '+input.files[0].name;}else if(input.id==='existingLogo')await run(async()=>{await api('logoUpload',{companyId:firm().id,data:str});await load();},'Firmenlogo gespeichert.');}
document.addEventListener('click',e=>{const more=e.target.closest?.('[data-mobile-more]');if(more){const sheet=document.getElementById('ft-mobile-sheet');const expanded=!sheet?.classList.contains('is-open');sheet?.classList.toggle('is-open',expanded);document.querySelectorAll('[data-mobile-more]').forEach(x=>x.setAttribute('aria-expanded',String(expanded)));return;}const b=e.target.closest('button[data-tab],button[data-act]');if(b){if(b.dataset.tab){
  ++FT_LOAD_SEQ; // Ein älterer Serveraufruf darf den neu gewählten Tab nicht überschreiben.
  ST.tab=b.dataset.tab;ST.edit='';
  if(['standby','availability'].includes(ST.tab)){
    const target=nextMonth(monthOf(new Date()));
    if(ST.month!==target){ST.month=target;ST.availMonth='';load();return;}
  }
  if(ST.tab==='rules'&&firm()){
    const companyId=firm().id, month=ST.month, key=companyId+'|'+month;
    if(ST.rules&&FT_RULES_KEY===key){page();return;}
    ST.rules=null;page();
    api('rulesGet',{companyId,month})
      .then(r=>{
        if(ST.tab!=='rules'||firm()?.id!==companyId||ST.month!==month)return;
        ST.rules=r;FT_RULES_KEY=key;page();
      }).catch(err=>say(err.message,true));
    return;
  }
  // First visit to a view only loads its own data; subsequent navigation is instant.
  const key=(firm()?.id||'SYS')+'|'+ST.month+'|'+ST.tab;
  if(!ST.h?.me||!FT_VIEWS_LOADED.has(key)||performance.now()-(FT_VIEW_FETCHED_AT.get(key)||0)>30000){
    const pane=document.getElementById('content');
    if(pane)pane.innerHTML='<div class="card">Ansicht wird geladen …</div>';
    load();return;
  }
  page();
}else action(b);return;}const zone=e.target.closest('[data-pick]');if(zone){const f=document.getElementById(zone.dataset.pick);if(f)f.click();}});
function staffValidationError(form){
  const invalid=Array.from(form.elements).find(el=>el.willValidate&&!el.checkValidity());
  if(!invalid)return false;
  const label=invalid.closest('label')?.querySelector('span')?.textContent || invalid.name || 'Eingabe';
  const message='Mitarbeiter nicht gespeichert: Bitte Feld „'+label+'“ prüfen. '+(invalid.validationMessage||'Ungültiger Wert.');
  say(message,true);
  invalid.scrollIntoView({block:'center',behavior:'smooth'});
  invalid.focus({preventScroll:true});
  invalid.reportValidity();
  return true;
}
// Eingabefehler sichtbar zeigen, statt einen scheinbar funktionslosen Button zu haben.
document.addEventListener('invalid',e=>{
  if(e.target?.form?.getAttribute('id')!=='staffForm')return;
  const el=e.target;
  const label=el.closest('label')?.querySelector('span')?.textContent || el.name || 'Eingabe';
  say('Bitte „'+label+'“ korrigieren: '+(el.validationMessage||'Ungültige Eingabe.'),true);
},true);
// Speichern wird gezielt ausgeloest und jeder JavaScript-Fehler angezeigt.
// click im Capture-Modus verhindert nicht, dass andere Menuebuttons funktionieren.
document.addEventListener('click',e=>{
  const button=e.target.closest?.('[data-ft-staff-save="1"]');
  if(!button)return;
  e.preventDefault();
  // Prevent other click actions from accidentally handling the save.
  e.stopPropagation();
  const form=button.closest('form');
  if(!form||form.dataset.saving==='1')return;
  if(staffValidationError(form))return;
  Promise.resolve(submit(form)).catch(err=>say('Mitarbeiter konnte nicht gespeichert werden: '+(err?.message||String(err)),true));
},true);
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.getAttribute('id')==='staffForm'&&staffValidationError(e.target))return;
  Promise.resolve().then(()=>submit(e.target)).catch(err=>say('Formularfehler: '+(err?.message||String(err)),true));
});
document.addEventListener('change',e=>{const x=e.target;if(x.id==='handoverShift'){const op=x.selectedOptions[0],f=x.form;if(op&&f){f.elements.namedItem('start').value=op.dataset.start||'';f.elements.namedItem('end').value=op.dataset.end||'';f.elements.namedItem('fromUserId').value=op.dataset.from||'';}}if(x.name==='workModel'){const form=x.form,h=form&&form.querySelector('[name=workHours]');if(h)h.value=x.value==='SHIFT12'?12:x.value==='SHIFT24'?24:8;}if(x.id==='monthPick'){ST.month=x.value;ST.availMonth='';load();}if(x.name==='reportUser'){ST.selected=x.value;FT_VIEWS_LOADED.delete((firm()?.id||'SYS')+'|'+ST.month+'|reports');load();}if(x.type==='file')run(()=>uploadFile(x));if(x.dataset.standby){
  const date=x.dataset.standby;
  const month=ST.month;
  const companyId=firm().id;
  const previous=ST.h.shifts.find(s=>s.day===date);
  const formerUserId=previous?.userId||'';
  const formerStatus=previous?.status||'OFFEN';
  const newUserId=x.value;
  if(newUserId===formerUserId)return;
  const available=has('AVAILABILITY')&&ST.h.availability.some(a=>a.userId===newUserId&&Number(a.day)===Number(date.slice(-2))&&a.answer==='YES')&&ST.h.availSubmissions.some(a=>a.userId===newUserId);
  if(newUserId&&!available&&has('AVAILABILITY')&&!confirm('Keine bestätigte Verfügbarkeit. Trotzdem einteilen?')){
    x.value=formerUserId;return;
  }
  if(previous?.status==='PUBLISHED'&&!confirm('Veröffentlichten Bereitschaftsdienst ändern?')){
    x.value=formerUserId;return;
  }
  const cell=x.closest('tr')?.cells[2];
  if(cell)cell.textContent='Speichert …';
  x.disabled=true;
  (async()=>{
    try{
      const result=await api('planAssign',{
        companyId,month,day:date,userId:newUserId,
        confirmAvailability:!available,
        confirmChange:previous?.status==='PUBLISHED'
      });
      if(!result?.row?.id)throw Error('Google hat die Bereitschaft nicht bestätigt.');
      // Datensatz gezielt aktualisieren. Kein kompletter home()-Abruf mehr.
      if(ST.h?.company?.id===companyId&&ST.month===month){
        const idx=ST.h.shifts.findIndex(s=>s.day===date);
        if(idx<0)ST.h.shifts.push(result.row);
        else ST.h.shifts[idx]=result.row;
        if(cell)cell.textContent=result.row.status||'ENTWURF';
        // Die Dashboard-Daten sind nach der Änderung veraltet.
        FT_VIEWS_LOADED.delete(companyId+'|'+month+'|dashboard');
      }
      say(result.warning||'Bereitschaft gespeichert.',Boolean(result.warning));
    }catch(err){
      x.value=formerUserId;
      if(cell)cell.textContent=formerStatus;
      say('Bereitschaft nicht gespeichert: '+String(err?.message||err),true);
    }finally{
      x.disabled=false;
    }
  })();
}});
document.addEventListener('dragover',e=>{if(e.target.closest('[data-pick]'))e.preventDefault();});
document.addEventListener('drop',e=>{const zone=e.target.closest('[data-pick]');if(zone){e.preventDefault();const el=document.getElementById(zone.dataset.pick),file=e.dataTransfer.files[0];if(el&&file){const dt=new DataTransfer();dt.items.add(file);el.files=dt.files;run(()=>uploadFile(el));}}});
if(SLUG)rpc('ft_brandForLogin',SLUG).then(b=>{if(!b)return;ST.brand=b;theme(b.color,b.secondaryColor);if(!ST.token)auth();}).catch(err=>console.warn('Firmenlogo beim Anmelden derzeit nicht ladbar:',err.message));
load();
// PWA-Installation: Eigener Dialog + systemeigene Bestätigung (nur bei unterstützten Browsern).
// Einladungstoken bleiben ausschließlich in der geöffneten Webseite; die App-Start-URL ist immer /.
(function ftInstallUI(){
  const dialog=document.getElementById('ft-install-mask');
  const help=document.getElementById('ft-install-help');
  const openBtn=document.getElementById('ft-install-open');
  const yesBtn=document.getElementById('ft-install-yes');
  const laterBtn=document.getElementById('ft-install-later');
  const installKey='ft_pwa_installed_v1';
  const dismissKey='ft_pwa_snooze_until_v1';
  const agent=navigator.userAgent||'';
  const ios=/iPad|iPhone|iPod/.test(agent)||(/Macintosh/.test(agent)&&navigator.maxTouchPoints>1);
  const mobile=ios||/Android/i.test(agent);
  const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  const installed=()=>standalone()||localStorage.getItem(installKey)==='yes';
  let nativePrompt=null;
  function close(){dialog.classList.remove('is-open');dialog.setAttribute('aria-hidden','true');help.classList.remove('is-visible');}
  function show(force=false){
    if(installed())return;
    if(!force&&Date.now()<Number(localStorage.getItem(dismissKey)||'0'))return;
    dialog.classList.add('is-open');dialog.setAttribute('aria-hidden','false');
    help.classList.remove('is-visible');
    yesBtn.textContent=ios?'Ja, Anleitung anzeigen':'Ja, installieren';
  }
  function updateButton(){openBtn.classList.toggle('is-visible',!installed());}
  function showHelp(message){help.textContent='';help.classList.add('is-visible');
    const p=document.createElement('div');p.textContent=message;help.appendChild(p);
  }
  window.addEventListener('beforeinstallprompt',event=>{
    event.preventDefault();
    nativePrompt=event;
    updateButton();
  });
  window.addEventListener('appinstalled',()=>{
    nativePrompt=null;localStorage.setItem(installKey,'yes');close();updateButton();
  });
  openBtn.addEventListener('click',()=>show(true));
  laterBtn.addEventListener('click',()=>{
    localStorage.setItem(dismissKey,String(Date.now()+7*86400000));close();
  });
  dialog.addEventListener('click',event=>{if(event.target===dialog)close();});
  document.addEventListener('keydown',event=>{if(event.key==='Escape')close();});
  yesBtn.addEventListener('click',async()=>{
    if(nativePrompt){
      const chosen=nativePrompt;
      nativePrompt=null;
      try{
        await chosen.prompt();
        const result=await chosen.userChoice;
        if(result?.outcome==='accepted'){
          localStorage.setItem(installKey,'yes');close();updateButton();
        }else{
          showHelp('Installation abgebrochen. Du kannst FireTime Pro später wieder über „App installieren“ hinzufügen.');
        }
      }catch(err){showHelp('Das Gerät hat die automatische Installationsabfrage nicht geöffnet. Bitte installiere FireTime Pro über das Browsermenü.');}
      return;
    }
    if(ios){
      showHelp('Auf dem iPhone: Im Browser auf „Teilen“ (Quadrat mit Pfeil) tippen → „Zum Home-Bildschirm“ / „Zum Homebildschirm hinzufügen“ → „Hinzufügen“. Apple erlaubt diesen Schritt nicht automatisch.');
    }else if(/Android/i.test(agent)){
      showHelp('Bitte in Chrome oder Samsung Internet öffnen und im Browsermenü ⋮ → „App installieren“ oder „Zum Startbildschirm hinzufügen“ auswählen. In manchen E-Mail-Apps muss die Seite zuerst über „Im Browser öffnen“ geöffnet werden.');
    }else{
      showHelp('Öffne das Installationssymbol in der Adressleiste von Chrome oder Edge oder verwende das Browsermenü „App installieren“.');
    }
  });
  updateButton();
  if(mobile&&!installed()){
    // Beim Öffnen eines Einladungslinks direkt anbieten; sonst nur beim ersten Besuch.
    const onInvite=new URLSearchParams(location.search).has('invite');
    const hasSeen=localStorage.getItem('ft_pwa_offer_seen_v1')==='yes';
    if(onInvite||!hasSeen){
      localStorage.setItem('ft_pwa_offer_seen_v1','yes');
      setTimeout(()=>show(false),1100);
    }
  }
  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>{
      navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(err=>{
        console.warn('FireTime Pro: PWA-Service-Worker konnte nicht aktiviert werden:',err.message);
      });
    });
  }
})();
</script></body></html>
