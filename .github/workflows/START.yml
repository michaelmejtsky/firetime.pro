      - name: Automatische Quellcode-Prüfung
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/worker.js
          cp apps-script/Code.gs /tmp/firetime-code.js
          node --check /tmp/firetime-code.js
          test -s index.html
          test -s config.js
          test -s README_START_HIER.md
          if grep -qi supabase index.html; then echo 'FEHLER: altes Frontend' >&2; exit 1; fi
      - name: Dateien automatisch in GitHub speichern
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'FireTime Pro: GitHub, Google-Backend und Cloudflare vollständig anlegen'
            git push
          fi
      - name: Ausgabe
        run: |
          echo 'Projektdateien erfolgreich angelegt.'
          echo 'Google Apps Script und Cloudflare muessen einmalig verbunden werden.'
      - name: Website vorbereiten
        shell: bash
        run: |
          mkdir -p _site/assets
          cp index.html config.js manifest.webmanifest sw.js .nojekyll _site/
          cp assets/firetime.svg _site/assets/
      - name: GitHub Pages prüfen
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - name: Website hochladen (sofern Pages aktiv ist)
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Website veröffentlichen (sofern Pages aktiv ist)
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
        continue-on-error: true
