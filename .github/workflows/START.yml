          import base64,hashlib,lzma,tarfile,io,pathlib
          root=pathlib.Path.cwd()
          data=base64.b64decode(pathlib.Path('/tmp/ftpro.txt').read_text())
          if hashlib.sha256(data).hexdigest()!='930c8cb95bb0a7861fcc86c5343f630a3b153f7c44fc73e13c7a2f8e8a599968':
