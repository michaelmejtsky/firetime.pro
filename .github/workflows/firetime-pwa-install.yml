          import pathlib,io,base64,lzma,hashlib,tarfile
          p=pathlib.Path('/tmp/firetime-pwa.b64')
          b=base64.b64decode(''.join(p.read_text().split()),validate=True)
          if hashlib.sha256(b).hexdigest()!='72ca5068adafa23862cd59df0ec63fb915baf6e09aeba4ca4d14fc828de7c1e1':
              raise SystemExit('PWA-Daten-Pruefsumme ungueltig')
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(b)),mode='r:') as tar:
              allow={"index.html","manifest.webmanifest","sw.js","assets/firetime-192.png","assets/firetime-512.png"}
              for entry in tar.getmembers():
                  if not entry.isfile() or entry.name not in allow:
                      raise SystemExit('Unerlaubte Archivdatei: '+entry.name)
                  path=pathlib.Path(entry.name)
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(tar.extractfile(entry).read())
                  print('Aktualisiert:',entry.name)
          PYINSTALL
      - name: Aenderungen ohne Workflow-Dateien speichern
        run: |
          set -euo pipefail
          git add -- index.html manifest.webmanifest sw.js assets/firetime-192.png assets/firetime-512.png
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'FireTime Pro: installierbare Handy-App mit Einladungsdialog'
            git push
          else
            echo 'PWA-Dateien sind bereits aktuell.'
          fi
