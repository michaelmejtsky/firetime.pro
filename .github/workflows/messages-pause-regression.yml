name: FireTime Pro Pausen Nachrichten
on:
  pull_request:
    paths:
      - 'apps-script/Code.gs'
      - 'index.html'
      - 'tests/messages-pause.test.cjs'
      - '.github/workflows/messages-pause-regression.yml'
  push:
    branches: [main]
    paths:
      - 'apps-script/Code.gs'
      - 'index.html'
      - 'tests/messages-pause.test.cjs'
      - '.github/workflows/messages-pause-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
