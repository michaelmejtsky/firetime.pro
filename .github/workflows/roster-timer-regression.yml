name: FireTime Pro Dienst und Zeiterfassung
on:
  pull_request:
    paths:
      - 'index.html'
      - 'apps-script/Code.gs'
      - 'tests/roster-timer.test.cjs'
      - '.github/workflows/roster-timer-regression.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'apps-script/Code.gs'
      - 'tests/roster-timer.test.cjs'
      - '.github/workflows/roster-timer-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/roster-timer.test.cjs
